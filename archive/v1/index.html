<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Affinity Level Calculator</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1a1a1a; --muted:#666; --border:#dcdfe3;
  --accent:#2f5fd6; --accent2:#eef2fc;
  --green:#c6efce; --greenT:#0f5c1f; --yellow:#ffeb9c; --yellowT:#7a5d00;
  --blue:#ddebf7; --blueT:#1d4e89; --danger:#d64545;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1f2226; --text:#e8e8e8; --muted:#9aa0a6; --border:#333a42;
    --accent:#6c93f5; --accent2:#222a3d;
    --green:#1e3a24; --greenT:#7be08c; --yellow:#3a3420; --yellowT:#e0c457;
    --blue:#1c2e3d; --blueT:#8fc2f5;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --text:#e8e8e8; --muted:#9aa0a6; --border:#333a42;
  --accent:#6c93f5; --accent2:#222a3d;
  --green:#1e3a24; --greenT:#7be08c; --yellow:#3a3420; --yellowT:#e0c457;
  --blue:#1c2e3d; --blueT:#8fc2f5;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);}
.wrap{max-width:980px;margin:0 auto;padding:20px 0 60px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
#langSelect{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;position:relative}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.corner-note{display:block;text-align:right;font-size:10.5px;line-height:1.4;color:var(--muted);font-style:italic;margin-top:12px;padding-top:8px;border-top:1px dashed var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center}
th{color:var(--muted);font-weight:600;font-size:12px}
td input,.inline-input{width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.field{flex:1;min-width:110px}
select{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-light{background:var(--accent2);color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.tier-grid{grid-template-columns:1fr}}
.tier-card{border-radius:10px;padding:10px;text-align:center;border:2px solid var(--border)}
.tier-card.t0{background:linear-gradient(180deg,rgba(90,200,110,.14),transparent)}
.tier-card.t1{background:linear-gradient(180deg,rgba(150,90,220,.16),transparent)}
.tier-card.t2{background:linear-gradient(180deg,rgba(220,180,50,.18),transparent)}
.tier-badge{font-size:11px;font-weight:700;border-radius:12px;padding:2px 10px;display:inline-block;margin-bottom:6px}
.t0 .tier-badge{background:#3fae57;color:#fff}
.t1 .tier-badge{background:#8a5cd6;color:#fff}
.t2 .tier-badge{background:#c9a233;color:#fff}
.item-list{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:8px}
.item-row{display:flex;align-items:center;gap:6px}
.item-row img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:0 0 auto}
.item-row-name{font-size:11.5px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star-btn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);flex:0 0 auto;padding:0 2px;line-height:1}
.star-btn.is-fav{color:#e0b400}
.result-table small{opacity:.75;font-size:10px}
.item-qty{width:52px;flex:0 0 auto;padding:4px;text-align:center}
.combo-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px;background:var(--accent2)}
.combo-card h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.preset-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.preset-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer}
.preset-item input{flex:0 0 auto}
.preset-item .cnt{color:var(--muted);font-size:11px;margin-left:auto}
.targets-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--accent2);border:1px solid var(--border);border-radius:16px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip.weighted{background:var(--blue);border-color:var(--blueT)}
.chip .w-badge{font-size:10px;font-weight:700;color:var(--blueT)}
.chip button{background:none;border:none;color:var(--danger);font-size:13px;padding:0;line-height:1}
.add-target-row{display:flex;gap:6px}
.add-target-row input{flex:1}
.result-table td.exact{background:var(--green);color:var(--greenT);font-weight:600}
.result-table td.near{background:var(--yellow);color:var(--yellowT)}
.result-table td.short{background:rgba(214,69,69,.18);color:var(--danger);font-weight:600}
.gap-inband{background:var(--blue);color:var(--blueT)}
.summary{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.current-box{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:10px;background:var(--accent2)}
.current-box>label:first-child{font-size:13px;font-weight:700}
.current-box input[type=number]{width:140px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;font-weight:600}
.current-box .hint{flex:1 1 100%;font-size:11.5px;color:var(--muted)}
.switch-line{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.chip.passed{opacity:.4;text-decoration:line-through}
.combo-head{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.combo-name{width:180px;font-weight:700}
.combo-block{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.block-title{font-size:13px;font-weight:700;margin-bottom:2px}
.block-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{flex:1 1 auto;background:var(--bg);color:var(--text);border:1px solid var(--border);font-weight:500;padding:7px 10px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.combo-nonfav{margin:4px 2px 8px;font-size:13px}
.pick-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick{display:flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--border);border-radius:16px;padding:3px 10px 3px 6px;background:var(--bg);cursor:pointer}
.pick img{width:20px;height:20px;border-radius:4px}
.adv summary{font-size:12px;color:var(--muted);cursor:pointer}
.save-actions{display:flex;flex-wrap:wrap;gap:8px}
.scan-status{flex:1 1 100%;font-size:12px;line-height:1.5}
.scan-status.ok{color:var(--greenT)}
.scan-status.bad{color:var(--danger)}
.item-row.warn .item-qty{border-color:#e0b400;background:rgba(224,180,0,.2)}
.stage-box{margin-top:14px;padding-top:10px;border-top:1px dashed var(--border)}
.stage-table td:first-child{white-space:nowrap}
.stage-sum td{border-top:2px solid var(--border)}
.hist-box{padding:10px 12px;margin-bottom:10px;border:1px solid var(--border);border-radius:10px;background:var(--accent2)}
.now-row td{background:var(--accent2);font-weight:600}
.tier-sel{font-weight:700;border-width:2px}
.tier-sel.t0{border-color:#3fae57}.tier-sel.t1{border-color:#8a5cd6}.tier-sel.t2{border-color:#c9a233}
.advice{border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.advice.warn{background:rgba(214,69,69,.12);border:1px solid #d64545}
.advice.info{background:rgba(63,130,214,.1);border:1px solid #3f82d6}
.advice button{margin-left:6px}
.pair-vis{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px}
.pair-pill{flex:1;max-width:150px;text-align:center;border-radius:14px;padding:10px 6px;border:2px solid;display:flex;flex-direction:column;gap:2px}
.pair-pill small{font-size:11px;color:var(--muted)}
.pair-pill b{font-size:20px}
.pair-pill.t0{border-color:#3fae57;background:rgba(63,174,87,.12)}.pair-pill.t1{border-color:#8a5cd6;background:rgba(138,92,214,.12)}.pair-pill.t2{border-color:#c9a233;background:rgba(201,162,51,.12)}
.pair-op{display:flex;align-items:center;justify-content:center;padding:0;border:0;background:var(--panel);color:var(--text);border-radius:50%;width:54px;height:54px;font-size:28px;font-weight:700;cursor:pointer;box-shadow:0 0 0 2px var(--border);position:relative;line-height:1}
.pair-op i{position:absolute;right:2px;bottom:0;font-size:12px;font-style:normal;color:var(--muted)}
.pair-op:hover{box-shadow:0 0 0 2px var(--text)}
.gap-eq{display:flex;align-items:flex-end;gap:10px}
.gap-eq .field{flex:1}
.gap-op{font-size:22px;font-weight:700;padding-bottom:4px;color:var(--muted)}
.gap-band{margin:4px 0 6px;max-width:440px}
.dual{position:relative;height:34px;margin:2px 0 0}
.dual-track{position:absolute;left:10px;right:10px;top:13px;height:8px;border-radius:4px;background:var(--border)}
.dual-fill{position:absolute;top:-4px;height:16px;border-radius:4px;opacity:.85;min-width:3px}
.dual input[type=range]{position:absolute;left:0;width:100%;top:0;height:34px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input[type=range]::-webkit-slider-runnable-track{background:none;height:34px}
.dual input[type=range]::-moz-range-track{background:none}
.dual input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--tc,#888);cursor:grab;margin-top:6px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--tc,#888);cursor:grab}
.dual-ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:10px;color:var(--muted,#888)}
.gap-eqline{font-size:12px;font-weight:600;margin-bottom:2px}
.gap-ctrl .gap-pair input[type=number]{width:84px}
.gap-svg{width:100%;height:auto;max-width:440px;display:block}
.gc-track{fill:var(--border)}
.gc-axis{stroke:var(--muted);stroke-width:1}
.gc-zero{stroke:var(--text);stroke-width:1.5;stroke-dasharray:3 2}
.gc-txt{fill:var(--muted);font-size:9px}
.gc-val{fill:var(--text);font-size:11px;font-weight:700}
.gc-end{fill:var(--text);font-size:10px;font-weight:600}
.gap-pair{display:flex;gap:8px;align-items:center}
.gap-pair input[type=range]{flex:1;min-width:80px}
.gap-pair input[type=number]{width:72px;flex:0 0 auto}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ai-box{margin:10px 0;padding:8px 10px;border:1px dashed var(--border);border-radius:10px}
.ai-box summary{cursor:pointer;font-weight:700;font-size:13px}
.ai-preview{white-space:pre-wrap;word-break:break-word;margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12px;line-height:1.5;max-height:240px;overflow:auto;user-select:all}
.ai-box .chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ai-text{width:100%;box-sizing:border-box;margin:6px 0;font-family:monospace;font-size:12px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--bg);color:var(--text)}
.chip-btn.on{background:var(--accent,#3b82f6);color:#fff;border-color:var(--accent,#3b82f6)}
.chip-btn.passed{opacity:.4}
.apply-chips{flex-wrap:wrap}
.chip-btn{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:3px 12px;font-size:12px;font-weight:600}
.item-max-grid .item-qty{width:60px}
.item-row.dim{opacity:.45}
.own{color:var(--muted);font-size:10.5px;flex:0 0 auto;min-width:30px}
.gap-chart{width:100%;height:auto;max-width:640px;display:block}
.gc-band{opacity:.22}
.gc-line{fill:none;stroke:var(--muted);stroke-width:1.5}
.gc-ok{fill:var(--greenT);stroke:var(--panel);stroke-width:1.5}
.gc-bad{fill:var(--danger);stroke:var(--panel);stroke-width:1.5}
.gc-off{fill:var(--muted);stroke:var(--panel);stroke-width:1.5}
.gc-now{stroke:var(--text);stroke-width:2}
.usage-grid .item-list{gap:8px}
.use-bar i.full{background:#d64545}
.use-row{display:flex;gap:8px;align-items:center}
.use-row img{width:28px;height:28px;border-radius:6px;flex:0 0 auto}
.use-main{flex:1;min-width:0}
.use-top{display:flex;justify-content:space-between;gap:6px;font-size:11.5px}
.use-bar{height:6px;border-radius:3px;background:var(--border);margin-top:3px;overflow:hidden}
.use-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.footer-note{font-size:11px;color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="t_title"></h1>
      <p class="sub" id="t_sub"></p>
    </div>
    <select id="langSelect" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="zhTW">繁體中文</option>
      <option value="zhCN">简体中文</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ไทย</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ru">Русский</option>
      <option value="tr">Türkçe</option>
      <option value="it">Italiano</option>
      <option value="pl">Polski</option>
      <option value="ar">العربية</option>
      <option value="ko">한국어</option>
      <option value="fil">Filipino</option>
    </select>
  </div>

  <div class="panel save-panel">
    <h2 id="t_saveTitle"></h2>
    <div class="save-actions">
      <button class="btn-light" id="t_saveDownload" onclick="downloadSave()"></button>
      <button class="btn-light" id="t_saveLoad" onclick="document.getElementById('saveFile').click()"></button>
      <input type="file" id="saveFile" accept=".json,application/json" hidden onchange="loadSaveFile(this.files[0]);this.value=''">
      <button class="btn-danger" id="t_saveReset" onclick="resetAll()"></button>
    </div>
    <div class="block-hint" id="t_saveHint" style="margin:8px 0 0"></div>
    <div class="scan-status" id="saveStatus"></div>
  </div>

  <div class="panel">
    <h2 id="t_varsTitle"></h2>
    <details class="ai-box" id="aiBox"><summary data-t="aiTitle"></summary>
      <div class="block-hint" data-t="aiStep1"></div>
      <div class="chips-row"><button class="btn-light" data-t="aiCopy" onclick="copyAIPrompt(this)"></button><button class="btn-light" id="aiPrevBtn" data-t="aiPreview" onclick="toggleAIPreview()"></button></div>
      <pre class="ai-preview" id="aiPreview" hidden></pre>
      <div class="block-hint" style="margin-top:10px" data-t="aiStep2"></div>
      <textarea id="aiText" rows="5" class="ai-text" spellcheck="false" placeholder='{"affinity": 0, "items": {"lollipop": {"count": 0, "favorite": false}}}'></textarea>
      <button class="btn-light" data-t="aiImport" onclick="importAI()"></button>
      <div class="scan-status" id="aiStatus"></div>
    </details>
    <div id="varTable" class="tier-grid"></div>
    <div class="corner-note" id="t_varsNote"></div>
  </div>

  <div class="panel">
    <h2 id="t_targetsTitle"></h2>
    <div class="current-box">
      <label for="curAff" id="t_currentTitle"></label>
      <input type="number" id="curAff" min="0" oninput="setCurrent(this.value)">
      <label class="switch-line"><input type="checkbox" id="showEarlier" onchange="showEarlier=this.checked"> <span id="t_showEarlier"></span></label>
      <div class="hint" id="t_currentHint"></div>
    </div>
    <div id="presetList" class="preset-list"></div>
    <div class="targets-list" id="targetChips"></div>
    <div class="add-target-row">
      <input type="number" id="newTarget">
      <button class="btn-light" id="t_addBtn" onclick="addTarget()"></button>
    </div>
    <div class="corner-note" id="t_targetsNote"></div>
  </div>

  <div class="panel">
    <h2><span id="t_combosTitle"></span> <button class="btn-light" id="t_addComboBtn" onclick="addCombo()"></button></h2>
    <div id="comboList"></div>
    <div class="corner-note" id="t_combosNote"></div>
  </div>

  <button class="btn-primary" id="t_calcBtn" onclick="calculateAll()" style="width:100%;padding:12px;font-size:14px"></button>

  <div id="results"></div>

  <p class="footer-note" id="t_legend"></p>
</div>

<script>
const LANG = {
en:{title:'💖 Hero Affinity Level Calculator',sub:'Set your 3 variables, your targets, and any combos (each with its own count-ratio rule). The tool fills in the minimum counts needed to reach every target.',
  varsTitle:'Affinity Gift Counter',varName:'Item',varValue:'Unit value',varCurrent:'Inventory (max)',favoriteGift:'Favorite Gift',useNonFav:'Use non-favorite gifts',varsNote:'List every gift with the amount you own. Tap the star to mark a hero’s favorite (only one per color; a new pick replaces the old). Favorites give +12 / +62 / +125, other gifts +10 / +50 / +100.',
  targetsTitle:'Affinity Reward Milestones',targetPlaceholder:'Target value',addBtn:'Add',targetsNote:'Check one or more reward lists below; values shared by multiple lists get a ×N weight badge and a tighter tolerance.',
  combosTitle:'Combos',addComboBtn:'+ Add Combo',combosNote:'Each combo applies its own ratio rule and reaches the targets independently.',
  firstVar:'First var',minus:'minus',minGap:'Min gap',maxGap:'Max gap',ruleApplies:'Rule applies',every:'Every target',finalOnly:'Final only',fromValue:'From value onward',fromValueLabel:'From value',tolerance:'Tolerance',remove:'Remove',
  calcBtn:'Calculate All Combos',
  exact:'Exact hits',within:'Within tolerance',incl:'incl. exact',totalOv:'Total overage',finalCounts:'Final counts',
  legend:'Green = exact hit · Yellow = within tolerance · Blue cell = ratio rule satisfied for that row.',shortfall:'Shortfall'},
zhTW:{title:'💖 英雄好感度計算器',sub:'設定您的3個變數、目標，以及任意數量的組合（每個組合可套用自己的數量差距規則）。工具會自動算出達成每個目標所需的最小數量。',
  varsTitle:'好感度禮物數量',varName:'物品',varValue:'單位價值',varCurrent:'庫存（上限）',favoriteGift:'角色喜愛禮物',useNonFav:'使用非喜愛禮物',varsNote:'逐一列出所有禮物並填入持有數量。點擊星星標記角色喜愛禮物（每個品質只能有一個，選第二個會取消原本的）。喜愛禮物為 綠+12／紫+62／金+125，其餘禮物為 綠+10／紫+50／金+100。',
  targetsTitle:'好感度獎勵目標',targetPlaceholder:'目標值',addBtn:'新增',targetsNote:'勾選下方一個或多個獎勵清單；多個清單共有的數值會顯示 ×N 權重標記並套用更嚴格的容差。',
  combosTitle:'組合',addComboBtn:'+ 新增組合',combosNote:'每個組合套用自己的數量差距規則，並各自達成目標。',

let itemState = {};
TIER_ITEMS.forEach(list=>list.forEach(k=>{ itemState[k] = {cap:0, favorite:false}; }));
function setFavorite(key, tierIdx, on){
  if(on){ TIER_ITEMS[tierIdx].forEach(k=>itemState[k].favorite=false); itemState[key].favorite=true; }
  else { itemState[key].favorite=false; }
  renderVars();
}
function tierFavKey(i){ return TIER_ITEMS[i].find(k=>itemState[k].favorite) || null; }
function itemCapFor(k,c){ const inv=itemState[k].cap, m=c&&c.itemMax?c.itemMax[k]:undefined; return (m===undefined||m===null||m==='')?inv:Math.min(inv,Math.max(0,+m||0)); }
function tierFavCap(i,c){ const k=tierFavKey(i); return k? itemCapFor(k,c) : 0; }
function nfItemsOf(i,c){ return TIER_ITEMS[i].filter(k=>!itemState[k].favorite); }
function tierNonFavCap(i,c){
  const base = nfItemsOf(i,c).reduce((s,k)=>s+itemCapFor(k,c),0);
  if(c && c.nfMode==='limit' && c.nfLimit && c.nfLimit[i]!=='' && c.nfLimit[i]!=null) return Math.min(base, Math.max(0,+c.nfLimit[i]||0));
  return base;
}
function allocNonFav(i,n,c){
  const items = nfItemsOf(i,c).map(k=>({key:k,cap:itemCapFor(k,c),n:0})).filter(o=>o.cap>0);
  let left=n;
  if(c.nfMode==='even'){
    while(left>0){
      const open=items.filter(o=>o.n<o.cap); if(!open.length) break;
      const minN=Math.min(...open.map(o=>o.n));
      const lows=open.filter(o=>o.n===minN);
      for(const o of lows){ if(left<=0) break; o.n++; left--; }
    }
  } else {
    for(const o of items){ const u=Math.min(o.cap,left); o.n=u; left-=u; }
  }
  return items.filter(o=>o.n>0);
}
function tierCap(i,c){ return c.useNonFavorite ? tierFavCap(i,c)+tierNonFavCap(i,c) : tierFavCap(i,c); }
let HIST={h:[0,0,0],base:0}, HMODE=false, TG=null;
const TL=()=>TG||targets;
function tierPoints(i,n,c){
  if(HMODE) return n*(tierFavKey(i)?FAVORITE_VALUES[i]:NORMAL_VALUES[i]);
  n=Math.max(0,n-HIST.h[i]);
  if(!c.useNonFavorite) return n*FAVORITE_VALUES[i];
  const favCap = tierFavCap(i,c);
  const used = Math.min(n, favCap);
  return used*FAVORITE_VALUES[i] + (n-used)*NORMAL_VALUES[i];
}
function minCountForPoints(i, n0, pointsNeeded, c){
  if(HMODE){ const v=tierFavKey(i)?FAVORITE_VALUES[i]:NORMAL_VALUES[i]; return Math.max(n0,Math.ceil(Math.max(0,pointsNeeded)/v)); }
  const h=HIST.h[i];
  return h+minCountCore(i,Math.max(0,n0-h),pointsNeeded,c);
}
function minCountCore(i, n0, pointsNeeded, c){
  const cap = tierCap(i,c);
  if(pointsNeeded<=0) return n0;
  if(!c.useNonFavorite){
    return Math.min(cap, Math.max(n0, Math.ceil(pointsNeeded/FAVORITE_VALUES[i])));
  }
  const favCap = tierFavCap(i,c);
  if(n0 < favCap){
    const fullFavPoints = favCap*FAVORITE_VALUES[i];
    if(pointsNeeded <= fullFavPoints){
      return Math.min(cap, Math.max(n0, Math.ceil(pointsNeeded/FAVORITE_VALUES[i])));
    }
    const remain = pointsNeeded - fullFavPoints;
    return Math.min(cap, favCap + Math.ceil(remain/NORMAL_VALUES[i]));
  }
  const basePoints = favCap*FAVORITE_VALUES[i] + (n0-favCap)*NORMAL_VALUES[i];
  const remain = pointsNeeded - basePoints;
  return Math.min(cap, n0 + Math.ceil(Math.max(0,remain)/NORMAL_VALUES[i]));
}

/* ===== AI-assisted import ===== */
function aiPromptText(){
  const tn=['green','purple','gold'];
  const list=TIER_ITEMS.map((l,i)=>tn[i]+' tier: '+l.map(k=>k+' ('+((ITEM_NAMES[k]&&ITEM_NAMES[k].en)||k)+')').join(', ')).join('\n');
  return 'This is a screenshot of a hero\u2019s gift / affinity screen from a mobile game. Read it and reply with ONLY one JSON object (no explanation, no markdown).\n'
   +'Format: {"affinity": <the hero\u2019s current affinity number shown on the screen, or 0 if not shown>, "items": {"lollipop": {"count": <number>, "favorite": <true|false>}, ...}}\n'
   +'There are 12 gift items. Use exactly these keys:\n'+list+'\n'
   +'"count" is the number shown on that item. "favorite" is true only for the item that has a heart badge (at most one per tier). If a number is unreadable, use null instead of guessing.';
}
function toggleAIPreview(){ const pre=document.getElementById('aiPreview'), b=document.getElementById('aiPrevBtn'); const show=pre.hidden; pre.hidden=!show; if(show) pre.textContent=aiPromptText(); b.textContent=t(show?'aiHide':'aiPreview'); b.setAttribute('data-t',show?'aiHide':'aiPreview'); }
function copyAIPrompt(btn){
  const txt=aiPromptText(), done=()=>{ const o=btn.textContent; btn.textContent=t('aiCopied'); setTimeout(()=>{ btn.textContent=t('aiCopy'); },1500); };
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }catch(e){ fallbackCopy(txt,done); }
}
function fallbackCopy(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
function importAI(){
  const st=document.getElementById('aiStatus'), raw=document.getElementById('aiText').value;
  const a=raw.indexOf('{'), b=raw.lastIndexOf('}'); let o=null;
  if(a>=0&&b>a){ try{ o=JSON.parse(raw.slice(a,b+1)); }catch(e){} }
  const items=o&&(o.items||o);
  if(!items||typeof items!=='object'){ st.className='scan-status bad'; st.textContent=t('aiBad'); return; }
  let n=0, f=0;
  Object.keys(itemState).forEach(k=>{ const v=items[k]; if(v===undefined||v===null) return; const c=(typeof v==='object')?v.count:v; if(c!==null&&c!==undefined&&isFinite(+c)){ itemState[k].cap=Math.max(0,Math.round(+c)); n++; } });
  TIER_ITEMS.forEach(list=>{ const fk=list.find(k=>items[k]&&typeof items[k]==='object'&&items[k].favorite===true); if(fk){ list.forEach(k=>itemState[k].favorite=(k===fk)); f++; } });
  const av=Math.max(0,Math.round(+(o&&o.affinity)||0)); if(av>0){ currentAff=av; document.getElementById('curAff').value=av; renderTargets(); }
  if(!n){ st.className='scan-status bad'; st.textContent=t('aiBad'); return; }
  renderVars(); queueSave(); st.className='scan-status ok';
  st.textContent=t('aiDone').replace('{n}',n).replace('{f}',f).replace('{v}',currentAff);
}

/* ===== save data system ===== */
const SAVE_KEY='heroAffinityCalc.save.v1';
let saveTimer=null, resetArmed=false;
function collectState(){
  return {app:'hero-affinity-calculator',version:1,savedAt:new Date().toISOString(),lang:curLang,
    items:Object.fromEntries(Object.entries(itemState).map(([k,v])=>[k,{cap:v.cap,favorite:v.favorite}])),
    presets:[...selectedPresets],customTargets:customTargets.slice(),currentAff,showEarlier,
    combos:JSON.parse(JSON.stringify(combos)),comboSeq};
}
function num(v,d,min,max){ v=Number(v); if(!isFinite(v)) return d; if(min!=null&&v<min) v=min; if(max!=null&&v>max) v=max; return v; }
function applyState(o){
  if(!o||o.app!=='hero-affinity-calculator'||typeof o!=='object') throw new Error('bad');
  if(o.lang&&LANG[o.lang]) curLang=o.lang;
  if(o.items&&typeof o.items==='object'){
    Object.keys(itemState).forEach(k=>{ const v=o.items[k]; if(v){ itemState[k].cap=Math.round(num(v.cap,0,0,1e7)); itemState[k].favorite=!!v.favorite; } });
    TIER_ITEMS.forEach(list=>{ let seen=false; list.forEach(k=>{ if(itemState[k].favorite){ if(seen) itemState[k].favorite=false; seen=true; } }); });
  }
  selectedPresets=new Set((Array.isArray(o.presets)?o.presets:[]).filter(k=>PRESET_LISTS[k]));
  customTargets=[...new Set((Array.isArray(o.customTargets)?o.customTargets:[]).map(Number).filter(v=>isFinite(v)&&v>0))];
  currentAff=Math.round(num(o.currentAff,0,0,1e9)); showEarlier=!!o.showEarlier;
  const modes=['auto','limit','even'], conds=['always','final','fromValue'];
  combos=(Array.isArray(o.combos)?o.combos:[]).slice(0,20).map((c,i)=>{
    let a=Math.round(num(c.a,0,0,2)), b=Math.round(num(c.b,1,0,2)); if(a===b||a===2||b===2){ a=0; b=1; }
    const nfItems={}, itemMax={}; Object.keys(itemState).forEach(k=>{ const m=c.itemMax&&c.itemMax[k]; if(m!==undefined&&m!==null&&m!==''&&isFinite(+m)) itemMax[k]=Math.max(0,Math.round(+m)); else if(c.nfMode==='specific'&&c.nfItems&&c.nfItems[k]===false) itemMax[k]=0; });
    return {id:Math.round(num(c.id,i,0,1e6)),name:String(c.name==null?'Combo '+(i+1):c.name).slice(0,40),a,b,dir:'A-B',lo:Math.max(0,num(c.lo,0)),hi:Math.max(0,num(c.hi,25),Math.max(0,num(c.lo,0))),
      cond:conds.includes(c.cond)?c.cond:'always',condVal:num(c.condVal,0),tol:num(c.tol,10,0),useNonFavorite:!!c.useNonFavorite,goldFirst:!!c.goldFirst,
      histOverride:(Array.isArray(c.histOverride)&&c.histOverride.length===3)?c.histOverride.map(v=>Math.max(0,Math.round(num(v,0)))):null,nfMode:modes.includes(c.nfMode)?c.nfMode:'auto',itemMax,nfLimit:[0,1,2].map(j=>{ const v=c.nfLimit&&c.nfLimit[j]; return (v===''||v==null)?'':Math.max(0,num(v,0)); }),nfItems};
  });
  comboSeq=Math.max(0,...combos.map(c=>c.id+1),num(o.comboSeq,0,0,1e6));
  computeTargets(); scanWarn=new Set();
  document.documentElement.dir=(curLang==='ar')?'rtl':'ltr';
  document.getElementById('langSelect').value=curLang;
  document.getElementById('curAff').value=currentAff||'';
  document.getElementById('showEarlier').checked=showEarlier;
  document.getElementById('results').innerHTML='';
  applyStatic(); renderVars(); renderPresets(); renderTargets(); renderCombos();
}
function saveMsg(text,cls){ const el=document.getElementById('saveStatus'); if(el){ el.className='scan-status '+(cls||''); el.textContent=text; } }
function autosave(){
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(collectState()));
    const d=new Date(), hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    saveMsg(t('saveAuto').replace('{t}',hh),''); }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(autosave,500); }
['change','click','input'].forEach(ev=>document.addEventListener(ev,queueSave,true));
window.addEventListener('pagehide',()=>{ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(collectState())); }catch(e){} });
async function downloadSave(){
  const data=JSON.stringify(collectState(),null,1), d=new Date();
  const fname='hero-affinity-save-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  try{
    if(window.claude&&claude.use){ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:fname,data}); saveMsg(t('saveDone'),'ok'); return; } }
  }catch(e){ if(e&&e.code==='declined') return; }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'})), a=document.createElement('a');
    a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    saveMsg(t('saveDone'),'ok');
  }catch(e){ saveMsg(t('saveBad'),'bad'); }
}
async function loadSaveFile(file){
  if(!file) return;
  try{ const o=JSON.parse(await file.text()); applyState(o); autosave(); saveMsg(t('saveLoaded'),'ok'); }
  catch(e){ saveMsg(t('saveBad'),'bad'); }
}
function resetAll(){
  const btn=document.getElementById('t_saveReset');
  if(!resetArmed){ resetArmed=true; btn.textContent=t('saveConfirm'); setTimeout(()=>{ resetArmed=false; btn.textContent=t('saveReset'); },4000); return; }
  resetArmed=false; btn.textContent=t('saveReset');
  Object.keys(itemState).forEach(k=>{ itemState[k].cap=0; itemState[k].favorite=false; });
  selectedPresets=new Set(['ph1','ph2']); customTargets=[]; currentAff=0; showEarlier=false; combos=[]; comboSeq=0;
  computeTargets(); addCombo(); combos[0].name='Combo 1';
  document.getElementById('curAff').value=''; document.getElementById('showEarlier').checked=false; document.getElementById('results').innerHTML='';
  scanWarn=new Set(); renderVars(); renderPresets(); renderTargets(); renderCombos();
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  saveMsg(t('saveResetDone'),'ok');
}
function bootLoad(){
  try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) applyState(JSON.parse(raw)); }catch(e){}
}
let selectedPresets = new Set(['ph1','ph2']);
let customTargets = [];
let targets = [];
let targetWeights = {};
function computeTargets(){
  const map = {};
  selectedPresets.forEach(key=>{
    PRESET_LISTS[key].forEach(v=>{ map[v]=(map[v]||0)+1; });
  });
  const all = new Set([...Object.keys(map).map(Number), ...customTargets]);
  targets = [...all].sort((a,b)=>a-b);
  targetWeights = {};
  targets.forEach(v=> targetWeights[v]=map[v]||0);
}
let currentAff = 0, showEarlier = false;
function setCurrent(v){ currentAff=Math.max(0,+v||0); combos.forEach(c=>c.histOverride=null); renderTargets(); }
let combos = [];
let comboSeq = 0;

function applyStatic(){
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent=t(el.getAttribute('data-t')); });
  { const pv=document.getElementById('aiPreview'); if(pv&&!pv.hidden) pv.textContent=aiPromptText(); }
  document.getElementById('t_title').textContent=t('title');
  document.getElementById('t_sub').textContent=t('sub');
  document.getElementById('t_varsTitle').textContent=t('varsTitle');
  document.getElementById('t_varsNote').textContent=t('varsNote');
  document.getElementById('t_targetsTitle').textContent=t('targetsTitle');
  document.getElementById('newTarget').placeholder=t('targetPlaceholder');
  document.getElementById('t_addBtn').textContent=t('addBtn');
  document.getElementById('t_targetsNote').textContent=t('targetsNote');
  document.getElementById('t_combosTitle').textContent=t('combosTitle');
  document.getElementById('t_addComboBtn').textContent=t('addComboBtn');
  document.getElementById('t_combosNote').textContent=t('combosNote');
  document.getElementById('t_calcBtn').textContent=t('calcBtn');
  document.getElementById('t_legend').textContent=t('legend');
  document.getElementById('t_saveTitle').textContent=t('saveTitle');
  document.getElementById('t_saveDownload').textContent=t('saveDownload');
  document.getElementById('t_saveLoad').textContent=t('saveLoad');
  document.getElementById('t_saveReset').textContent=t('saveReset');
  document.getElementById('t_saveHint').textContent=t('saveHint');
  document.getElementById('t_currentTitle').textContent=t('currentTitle');
  document.getElementById('t_currentHint').textContent=t('currentHint');
  document.getElementById('t_showEarlier').textContent=t('showEarlier');
  document.getElementById('curAff').placeholder=t('currentPh');
}
function setLang(l){ curLang=l; document.documentElement.dir = (l==='ar')?'rtl':'ltr'; applyStatic(); renderVars(); renderPresets(); renderCombos(); }

function renderVars(){
  const box = document.getElementById('varTable');
  box.innerHTML = [0,1,2].map(i=>`
    <div class="tier-card t${i}">
      <span class="tier-badge">★${FAVORITE_VALUES[i]} / ☆${NORMAL_VALUES[i]}</span>
      <div class="item-list">
        ${TIER_ITEMS[i].map(k=>{
          const st = itemState[k];
          return `<div class="item-row${scanWarn.has(k)?' warn':''}">
            <img src="${ITEM_IMG[k]}" alt="${itemName(k)}">
            <span class="item-row-name">${itemName(k)}</span>
            <button class="star-btn${st.favorite?' is-fav':''}" title="${t('favoriteGift')}" onclick="setFavorite('${k}',${i},${!st.favorite})">${st.favorite?'\u2605':'\u2606'}</button>
            <input class="inline-input item-qty" type="number" min="0" value="${st.cap}" onchange="itemState['${k}'].cap=Math.max(0,+this.value);scanWarn.delete('${k}');this.closest('.item-row').classList.remove('warn')">
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');
}
function togglePreset(key, on){
  if(on) selectedPresets.add(key); else selectedPresets.delete(key);
  computeTargets(); renderTargets();
}
function renderPresets(){
  const box = document.getElementById('presetList');
  box.innerHTML = PRESET_ORDER.map(key=>`
    <label class="preset-item">
      <input type="checkbox" ${selectedPresets.has(key)?'checked':''} onchange="togglePreset('${key}', this.checked)">
      <span>${presetName(key)}</span>
    </label>`).join('');
}
function renderTargets(){
  const box = document.getElementById('targetChips');
  box.innerHTML = targets.map(tg=>{
    const w = targetWeights[tg]||0;
    const isCustom = customTargets.includes(tg);
    const weighted = w>=2;
    return `<span class="chip${weighted?' weighted':''}${tg<=currentAff&&currentAff>0?' passed':''}">${tg}${weighted?`<span class="w-badge">\u00d7${w}</span>`:''}${isCustom?`<button onclick="removeTarget(${tg})">✕</button>`:''}</span>`;
  }).join('');
  try{ renderCombos(); }catch(e){}
}
function addTarget(){
  const el = document.getElementById('newTarget');
  const val = +el.value;
  if(!isNaN(val) && val>0 && !customTargets.includes(val)){ customTargets.push(val); el.value=''; computeTargets(); renderTargets(); }
}
function removeTarget(v){ customTargets = customTargets.filter(x=>x!==v); computeTargets(); renderTargets(); }

function addCombo(){
  const id = comboSeq++;
  combos.push({id, name:'Combo '+(combos.length+1), a:0, b:1, dir:'A-B', lo:0, hi:25, cond:defaultStart()?'fromValue':'always', condVal:defaultStart(), tol:10, useNonFavorite:false, goldFirst:false, nfMode:'auto', nfLimit:['','',''], nfItems:{}, itemMax:{}, histOverride:null});
  renderCombos();
}
function removeCombo(id){ combos = combos.filter(c=>c.id!==id); renderCombos(); }

function renderCombos(){
  combos.forEach(c=>{ if(c.cond==='final'){ c.cond='fromValue'; c.condVal=targets.length?targets[targets.length-1]:0; } });
  const box = document.getElementById('comboList');
  const colorOpts = (sel,other)=>[0,1,2].filter(i=>i!==other).map(i=>`<option value="${i}" ${i==sel?'selected':''}>${tierLabel(i)}</option>`).join('');
  box.innerHTML = combos.map(c=>`
    <div class="combo-card">
      <div class="combo-head">
        <input class="inline-input combo-name" value="${c.name}" onchange="updCombo(${c.id},'name',this.value)">

          <div class="pair-pill t0"><b>${tierLabel(0)}</b></div>

        <div class="row gap-ctrl">
          <div class="field"><label>${t('gapMin')}</label><div class="gap-pair"><input class="inline-input" type="number" min="0" id="gl-${c.id}" value="${c.lo}" onchange="gapSet(${c.id},'lo',this.value)"></div></div>
          <div class="field"><label>${t('gapMax')}</label><div class="gap-pair"><input class="inline-input" type="number" min="0" id="gh-${c.id}" value="${c.hi}" onchange="gapSet(${c.id},'hi',this.value)"></div></div>
        </div>
        <div class="chips-row">${[[0,5],[0,10],[0,25],[10,30]].map(([l,h])=>`<button class="chip-btn" onclick="gapPreset(${c.id},${l},${h})">${l}\u2013${h}</button>`).join('')}</div>
      </div>
      <div class="combo-block">
        <div class="block-title">\uD83C\uDFAF ${t('applyTitle')}</div>
        <div class="block-hint">${t('applyHint')}</div>
        <div class="chips-row apply-chips"><button class="chip-btn${c.cond==='always'?' on':''}" onclick="setStart(${c.id},0)">${t('applyAll')}</button>${targets.map(v=>`<button class="chip-btn${(c.cond==='always'||v>=c.condVal)?' on':''}${v<=currentAff&&currentAff>0?' passed':''}" onclick="setStart(${c.id},${v})">${v}</button>`).join('')}</div>
      </div>
      <label class="switch-line combo-nonfav"><input type="checkbox" ${c.goldFirst?'checked':''} onchange="setNf(${c.id},'goldFirst',this.checked)"> <span>${t('goldFirst')}</span></label>
      ${c.goldFirst?`<div class="block-hint" style="margin:-2px 0 8px 26px">${t('goldFirstHint')}</div>`:''}
      <label class="switch-line combo-nonfav"><input type="checkbox" ${c.useNonFavorite?'checked':''} onchange="setNf(${c.id},'useNonFavorite',this.checked)"> <span>${t('useNonFav')}</span></label>
      ${c.useNonFavorite?`<div class="combo-block">
        <div class="block-title">\uD83C\uDF81 ${t('nfTitle')}</div>
        <div class="seg">
          ${[['auto','nfAuto'],['limit','nfLimit'],['even','nfEven']].map(([v,k])=>`<button class="${c.nfMode==v?'on':''}" onclick="setNf(${c.id},'nfMode','${v}')">${t(k)}</button>`).join('')}
        </div>
        ${c.nfMode==='limit'?`<div class="block-hint" style="margin-top:8px">${t('nfLimitLabel')}</div><div class="row">${[0,1,2].map(i=>`<div class="field"><label>${tierLabel(i)}</label><input class="inline-input" type="number" min="0" placeholder="\u221E" value="${c.nfLimit[i]}" onchange="setNfLimit(${c.id},${i},this.value)"></div>`).join('')}</div>`:''}
      </div>`:''}
      <div class="combo-block">

    const head=`<tr><th>${t('targetsTitle')}</th><th>${tierLabel(0)}</th><th>${tierLabel(1)}</th><th>${tierLabel(2)}</th><th>Total</th><th>${t('totalOv')}</th><th>Gap</th></tr>`;

    if(A>0){
      const hp=[0,1,2].map(i=>H[i]>0?(tierFavKey(i)?`★${itemName(tierFavKey(i))}×${H[i]}`:`${tierLabel(i)}×${H[i]}`):'—');
      histBox=`<div class="hist-box"><div class="block-title">🔍 ${t('histTitle').replace('{a}',A)}</div>
        <div class="block-hint">${t('histHint')} ${t('histAssume')}</div>
        <div class="row">${[0,1,2].map(i=>`<div class="field"><label>${tierLabel(i)}</label><input class="inline-input" type="number" min="0" value="${H[i]}" onchange="setHist(${c.id},${i},this.value)"></div>`).join('')}
        ${c.histOverride?`<div class="field" style="flex:0 0 auto"><label>&nbsp;</label><button class="btn-light" onclick="resetHist(${c.id})">${t('histReset')}</button></div>`:''}</div>
        <div class="summary">${hp.map((x,i)=>`<div><b>${tierLabel(i)}</b>: ${x}</div>`).join('')}</div>
        <div class="block-hint">${t('remainNote')}</div></div>`;
      nowRow=`<tr class="now-row"><td>${t('histNow')} (${A})</td><td>${H[0]}</td><td>${H[1]}</td><td>${H[2]}</td><td>${A}</td><td></td><td>${gapOf(H,c)}</td></tr>`;
      if(fullRows) fullBox=`<div class="stage-box"><div class="block-title">${t('fullPath')}</div><table class="result-table">${head}${rowsHTML(fullRows,c,effTol)}</table></div>`;
    }
    const panel = document.createElement('div');
    panel.className='panel';
    panel.innerHTML = `<h2>${c.name}</h2>
      ${histBox}
      ${A>0?`<div class="block-title" style="margin-top:12px">🎯 ${t('planFrom')} (${A})</div>`:''}
      ${adviceHTML(c,advice)}
      <table class="result-table">${head}${nowRow}${rowsHTML(rows,c,effTol)}</table>
      <div class="stage-box">
        <div class="block-title">📈 ${t('stageTitle')}</div>
        <div class="block-hint">${t('stageHint')}</div>
        <table class="result-table stage-table"><tr><th>${t('stageStage')}</th><th>${tierLabel(0)}</th><th>${tierLabel(1)}</th><th>${tierLabel(2)}</th><th>${t('stagePoints')}</th></tr>
        ${stages.map(g=>`<tr><td>${g.from} → ${g.to}</td>${g.d.map(v=>`<td>${v>0?'+'+v:'0'}</td>`).join('')}<td>+${g.pts}</td></tr>`).join('')}
        <tr class="stage-sum"><td><b>${t('stageSum')}</b></td>${stageSum.map(v=>`<td><b>+${v}</b></td>`).join('')}<td><b>+${stagePts}</b></td></tr>
        </table>
      </div>
      <div class="summary">${t('exact')}: <b>${exactN}/${rows.length}</b> &nbsp;|&nbsp; ${t('within')} (${t('incl')}): <b>${nearN}/${rows.length}</b> &nbsp;|&nbsp; ${t('totalOv')}: <b>${totOv}</b>${shortN?` &nbsp;|&nbsp; <span style="color:var(--danger)">${t('shortfall')}: ${shortN}</span>`:''} &nbsp;|&nbsp; ${t('finalCounts')}: ${tierLabel(0)}=${lastRow.counts[0]}, ${tierLabel(1)}=${lastRow.counts[1]}, ${tierLabel(2)}=${lastRow.counts[2]}</div>
      <div class="stage-box"><div class="block-title">\uD83D\uDCCA ${t('gapChart')} (${tierLabel(c.a)} \u2212 ${tierLabel(c.b)})</div><div class="block-hint">${t('gapChartHint')}</div>${gapChart(rows,c,H,A)}</div>
      <div class="stage-box"><div class="block-title">\uD83C\uDF81 ${t('nfBreakdown')}</div>${breakdown}</div>
      ${fullBox}`;
    resBox.appendChild(panel);
  });
}

computeTargets();
applyStatic(); renderVars(); renderPresets(); renderTargets();
addCombo(); combos[0].name='Combo 1'; combos[0].lo=0; combos[0].hi=25;
renderCombos();
bootLoad();
</script>
</body>
</html>
