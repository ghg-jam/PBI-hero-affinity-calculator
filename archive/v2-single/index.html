.rc-t.t0{border-color:#3fae57;background:rgba(63,174,87,.12)}.rc-t.t1{border-color:#8a5cd6;background:rgba(138,92,214,.12)}.rc-t.t2{border-color:#c9a233;background:rgba(201,162,51,.12)}

.pb-pct{font-size:calc(24px*var(--fs));font-weight:800;line-height:1;color:#2e9e57}.pb-pct small{font-size:calc(14px*var(--fs));font-weight:700}
.pb-frac{font-size:calc(13px*var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}.pb-frac b{color:var(--text)}
.pbar{position:relative;height:80px;margin:0 14px}
.pb-track{position:absolute;left:0;right:0;top:44px;height:12px;border-radius:6px;background:var(--border);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.pb-done{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:linear-gradient(180deg,#58c873,#2e9e57);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:width .5s ease}
.pb-done::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);background-size:200% 100%;animation:pbshine 2.8s linear infinite}
@keyframes pbshine{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.pb-done::after{animation:none}.pb-done{transition:none}}
.pb-plan{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(59,130,246,.7) 0 6px,rgba(59,130,246,.38) 6px 12px)}
.pb-node{position:absolute;top:28px;width:18px;height:22px;margin-left:-9px;--pc:var(--border);--pf:var(--panel);--pd:var(--border);transform-origin:50% 92%}
.pb-node::before{content:'';position:absolute;left:2px;top:2px;width:var(--ic-xs);height:var(--ic-xs);border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pf);border:2.5px solid var(--pc);box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pb-node::after{content:'';position:absolute;left:6.5px;top:6.5px;width:5px;height:5px;border-radius:50%;background:var(--pd)}
.pb-node.done{--pc:#2e9e57;--pf:#2e9e57;--pd:#fff}.pb-node.exact{--pc:#2e9e57;--pf:#d5f0dc;--pd:#2e9e57}.pb-node.near{--pc:#d9a400;--pf:#fbefc4;--pd:#d9a400}.pb-node.over{--pc:#8a8f98;--pf:#e3e5e8;--pd:#8a8f98}.pb-node.short{--pc:#d64545;--pf:#f8d3d3;--pd:#d64545}
.pb-node.next{--pc:#3b82f6;--pf:#dbe8fe;--pd:#3b82f6;z-index:2;animation:pbbounce 1.6s ease-in-out infinite}
@keyframes pbbounce{0%,100%{transform:scale(1.3) translateY(0)}50%{transform:scale(1.3) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pb-node.next{animation:none;transform:scale(1.3)}}
.pb-grp{margin:10px 0 2px;padding-top:8px;border-top:1px dashed var(--border)}.pb-grp:first-of-type{border-top:0;padding-top:0;margin-top:4px}

.pb-now.r{transform:translateX(-88%)}.pb-now.r::after{left:88%}.pb-now.l{transform:translateX(-12%)}.pb-now.l::after{left:12%}
.pb-sum{font-size:calc(12px*var(--fs));color:var(--muted);text-align:center;margin-top:2px}
.pb-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:6px;font-size:calc(11px*var(--fs));color:var(--muted)}

/* ===== targets tab (phase 4) ===== */
input[type=checkbox]{accent-color:var(--accent)}
.current-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--accent2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.current-box>label:first-child{font-size:calc(14px*var(--fs))}
#curAff{width:150px;font-size:calc(20px*var(--fs));font-weight:600;text-align:center;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:8px 10px}
.current-box .hint{flex:1 1 100%;margin:0}
.preset-item{align-items:center;padding:12px 12px;background:var(--panel);transition:background .15s,border-color .15s}
.preset-item:has(input:checked){background:var(--accent2);border-color:var(--accent)}
.preset-item .pi-name{flex:1;min-width:0;line-height:1.3}
.preset-item .cnt{white-space:nowrap;font-size:calc(12px*var(--fs));padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.goal-progress{margin:6px 0 10px}
.targets-list{margin-top:6px}
.chip{font-size:calc(12px*var(--fs));padding:3px 10px;font-weight:500;color:var(--muted);background:var(--bg)}
.chip.weighted{color:var(--text)}
.chip.passed{opacity:1;text-decoration:none;color:var(--g-t);background:var(--g-bg);border-color:transparent}
.chip.passed::before{content:'\2713';font-size:.85em}

/* ===== combos tab (phase 5) ===== */
.combo-card{background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.combo-head{padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px}
.combo-name{flex:1 1 auto;min-width:0;width:auto;font-size:calc(16px*var(--fs));font-weight:650;background:transparent;border:1px dashed transparent;border-radius:8px;padding:6px 8px}
.combo-name:hover,.combo-name:focus{border-color:var(--border);background:var(--bg)}
.combo-head .btn-danger{border-color:var(--border);color:var(--muted);font-weight:500;padding:6px 12px}
.combo-head .btn-danger:hover{border-color:var(--danger);color:var(--danger)}
.combo-card>.combo-block{background:transparent;border:0;border-radius:0;padding:0;margin:0 0 12px}
.combo-card>.combo-block .block-title{font-size:calc(14px*var(--fs))}
.combo-nonfav{margin:0 0 10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:calc(14px*var(--fs))}
.combo-nonfav:has(input:checked){background:var(--accent2);border-color:var(--accent)}
.adv-main{background:transparent}
.adv-main>summary{font-weight:600}
.combo-card .gap-visual{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
@media (max-width:480px){.pair-vis{gap:6px}.pair-pill{padding:10px 4px;gap:5px}.pair-pill b{font-size:calc(16px*var(--fs))}.pair-op{width:50px;height:50px}.combo-card{padding:12px}.combo-card .gap-visual{padding:10px 8px}}

/* ===== results tab (phase 6) ===== */
.sum-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 8px}
.sum-tile{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.sum-val{font-size:calc(24px*var(--fs));font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sum-val small{font-size:calc(13px*var(--fs));font-weight:500;color:var(--muted)}
.sum-lab{font-size:calc(12px*var(--fs));color:var(--muted);margin-top:4px;line-height:1.25;overflow-wrap:anywhere}
.sum-sub{font-size:calc(11px*var(--fs));color:var(--muted);opacity:.85}
.sum-tile.ok{background:var(--g-bg);border-color:transparent}.sum-tile.ok .sum-val{color:var(--g-t)}
.sum-tile.bad{background:rgba(214,69,69,.12);border-color:transparent}.sum-tile.bad .sum-val{color:var(--danger)}
.sum-final{font-size:calc(13px*var(--fs));color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sum-final span{padding:2px 10px;border-radius:999px;font-size:calc(12px*var(--fs))}
.sum-final b{color:var(--text)}
.sum-final .fc0{background:var(--g-bg);color:var(--g-t)}.sum-final .fc1{background:var(--p-bg);color:var(--p-t)}.sum-final .fc2{background:var(--y-bg);color:var(--y-t)}

@media (max-width:560px){.sum-strip{grid-template-columns:repeat(2,1fr)}}

/* ===== gift columns: wrap instead of crushing names ===== */
.tier-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.item-row{display:grid;grid-template-columns:auto minmax(72px,1fr) auto auto;align-items:center;column-gap:8px}
.item-row-name{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word;word-break:normal;hyphens:manual;line-height:1.25;min-width:0}

.size-num input{width:3ch;min-width:0;height:auto;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:right;box-shadow:none;outline:0;-moz-appearance:textfield}
.size-num input::-webkit-outer-spin-button,.size-num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* one look for every dropdown */
select,#langSelect,.final-box select,.view-pick select{width:100%;min-width:0;max-width:100%;min-height:44px;box-sizing:border-box;padding:10px 40px 10px 14px;border:1px solid var(--border);border-radius:12px;background-color:var(--panel);color:var(--text);font-size:calc(15px*var(--fs));font-weight:600;background-position:right 14px center;background-size:var(--ic-s) var(--ic-s);cursor:pointer}
.lang-wrap #langSelect{padding-left:44px;border:1px solid var(--border)!important;background-color:var(--panel);border-radius:12px;height:auto;min-height:44px;padding-right:40px}
select:hover,#langSelect:hover{border-color:var(--accent)}
select:focus-visible,#langSelect:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.view-pick select{flex:1 1 220px}

/* combo card: advanced groups + even apply chips */
.adv-group{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}
.adv-group>.block-title{margin-bottom:6px}
.adv-group .block-hint{margin:0 0 10px}
.adv-main>summary{margin:0}
.adv-label{font-size:calc(13px*var(--fs));font-weight:650;color:var(--text);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.adv-sub{margin-top:12px}
.adv-sub>summary.adv-label{margin:12px 0 0;cursor:pointer}
details.adv-sub[open]>summary.adv-label{margin-bottom:8px}
.adv-group .gap-visual,.adv-gap{background:var(--bg)}
.apply-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.apply-chips .chip-btn{width:100%;justify-content:center;text-align:center;margin:0;padding:9px 4px;min-height:40px;box-sizing:border-box;border-radius:10px}
.apply-chips .chip-btn:first-child{grid-column:1/-1}
.apply-chips .chip-btn.passed:not(.on){opacity:.5}
.apply-status{background:var(--panel)}
.adv-group .tol-block{margin:0}
/* order: toggle inside each tier card */
.ord-card{flex-direction:column;align-items:stretch;gap:8px}
.ord-top{display:flex;align-items:center;gap:10px;min-width:0}
.ord-stage.multi .ord-top{flex-direction:column;gap:2px;justify-content:center;text-align:center}
.ord-same{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--muted);font:600 calc(12px*var(--fs))/1.25 inherit;font-family:inherit;text-align:left;cursor:pointer;min-height:34px;touch-action:manipulation}
.ord-same.on{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.ord-box{flex:none;width:16px;height:16px;border:1.5px solid currentColor;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.ord-same.on .ord-box{background:var(--accent);border-color:var(--accent)}
.ord-same.on .ord-box::after{content:"";width:8px;height:4px;border:2px solid var(--on-accent,#fff);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ord-stage.multi .ord-card{padding:8px}

/* progress bar follows the theme colour */
.pb-pct{color:var(--accent)}
.pb-done{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 72%,#fff),var(--accent))}
.pb-node.done{--pc:var(--accent);--pf:var(--accent);--pd:var(--on-accent,#fff)}

/* result tabs */
.res-off{display:none!important}
.res-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:20;background:var(--bg)}
.res-tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;max-width:70vw;padding:8px 14px;min-height:42px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--muted);font:600 calc(14px*var(--fs))/1.2 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.res-tabs button span{overflow:hidden;text-overflow:ellipsis}
.res-tabs button i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent2);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(12px*var(--fs))}
.res-tabs button.on{background:var(--accent2);border-color:var(--accent);color:var(--text);box-shadow:inset 0 -3px 0 var(--accent)}
.res-tabs button.on i{background:var(--accent);color:var(--on-accent,#fff)}
.res-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cmp-list{display:flex;flex-direction:column;gap:10px}
.cmp-item{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);cursor:pointer;font-family:inherit}
.cmp-item.best{border-color:var(--accent);background:var(--accent2)}
.cmp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:calc(15px*var(--fs))}
.cmp-best{font-size:calc(12px*var(--fs));font-weight:700;color:var(--on-accent,#fff);background:var(--accent);padding:2px 10px;border-radius:999px}
.cmp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmp-stats span{display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--border);min-width:0}
.cmp-stats small{font-size:calc(11px*var(--fs));color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.cmp-stats b{font-size:calc(16px*var(--fs))}
.cmp-stats .bad b{color:#d64545}
.cmp-fin{margin-top:8px;font-size:calc(13px*var(--fs));display:flex;flex-wrap:wrap;gap:6px}
.cmp-fin span{padding:2px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
@media (max-width:480px){.cmp-stats{grid-template-columns:repeat(2,1fr)}}
.sz-ic{display:flex;align-items:center;justify-content:center;height:28px;width:100%;line-height:1}
.sz-a{font-weight:800;font-family:inherit}
</style>

let itemState = {};
TIER_ITEMS.forEach(list=>list.forEach(k=>{ itemState[k] = {cap:0, favorite:false}; }));
function setFavorite(key, tierIdx, on){
  if(on){ TIER_ITEMS[tierIdx].forEach(k=>itemState[k].favorite=false); itemState[key].favorite=true; }
  else { itemState[key].favorite=false; }
  renderVars();
}
function tierFavKey(i){ return TIER_ITEMS[i].find(k=>itemState[k].favorite) || null; }
function itemCapFor(k,c){ const inv=itemState[k].cap, m=c&&c.itemMax?c.itemMax[k]:undefined; return (m===undefined||m===null||m==='')?inv:Math.min(inv,Math.max(0,+m||0)); }
function tierFavCap(i,c){ const k=tierFavKey(i); return k? itemCapFor(k,c) : 0; }
function nfItemsOf(i,c){ return TIER_ITEMS[i].filter(k=>!itemState[k].favorite); }
function tierNonFavCap(i,c){
  const base = nfItemsOf(i,c).reduce((s,k)=>s+itemCapFor(k,c),0);
  if(c && c.nfMode==='limit' && c.nfLimit && c.nfLimit[i]!=='' && c.nfLimit[i]!=null) return Math.min(base, Math.max(0,+c.nfLimit[i]||0));
  return base;
}
function allocNonFav(i,n,c){
  const items = nfItemsOf(i,c).map(k=>({key:k,cap:itemCapFor(k,c),n:0})).filter(o=>o.cap>0);
  let left=n;
  if(c.nfMode==='even'){
    while(left>0){
      const open=items.filter(o=>o.n<o.cap); if(!open.length) break;
      const minN=Math.min(...open.map(o=>o.n));
      const lows=open.filter(o=>o.n===minN);
      for(const o of lows){ if(left<=0) break; o.n++; left--; }
    }
  } else {
    for(const o of items){ const u=Math.min(o.cap,left); o.n=u; left-=u; }
  }
  return items.filter(o=>o.n>0);
}
function tierCap(i,c){ return c.useNonFavorite ? tierFavCap(i,c)+tierNonFavCap(i,c) : tierFavCap(i,c); }
let HIST={h:[0,0,0],base:0}, HMODE=false, TG=null;
const TL=()=>TG||activeTargets();
function tierPoints(i,n,c){
  if(HMODE) return n*(tierFavKey(i)?FAVORITE_VALUES[i]:NORMAL_VALUES[i]);
  n=Math.max(0,n-HIST.h[i]);
  if(!c.useNonFavorite) return n*FAVORITE_VALUES[i];
  const favCap = tierFavCap(i,c);
  const used = Math.min(n, favCap);
  return used*FAVORITE_VALUES[i] + (n-used)*NORMAL_VALUES[i];
}
function minCountForPoints(i, n0, pointsNeeded, c){
  if(HMODE){ const v=tierFavKey(i)?FAVORITE_VALUES[i]:NORMAL_VALUES[i]; return Math.max(n0,Math.ceil(Math.max(0,pointsNeeded)/v)); }
  const h=HIST.h[i];
  return h+minCountCore(i,Math.max(0,n0-h),pointsNeeded,c);
}
function minCountCore(i, n0, pointsNeeded, c){
  const cap = tierCap(i,c);
  if(pointsNeeded<=0) return n0;
  if(!c.useNonFavorite){
    return Math.min(cap, Math.max(n0, Math.ceil(pointsNeeded/FAVORITE_VALUES[i])));
  }
  const favCap = tierFavCap(i,c);
  if(n0 < favCap){
    const fullFavPoints = favCap*FAVORITE_VALUES[i];
    if(pointsNeeded <= fullFavPoints){
      return Math.min(cap, Math.max(n0, Math.ceil(pointsNeeded/FAVORITE_VALUES[i])));
    }
    const remain = pointsNeeded - fullFavPoints;
    return Math.min(cap, favCap + Math.ceil(remain/NORMAL_VALUES[i]));
  }
  const basePoints = favCap*FAVORITE_VALUES[i] + (n0-favCap)*NORMAL_VALUES[i];
  const remain = pointsNeeded - basePoints;
  return Math.min(cap, n0 + Math.ceil(Math.max(0,remain)/NORMAL_VALUES[i]));
}

function fixNumInputs(root){ (root||document).querySelectorAll('input[type=number]:not([inputmode])').forEach(e=>e.setAttribute('inputmode','numeric')); }

/* ===== wrap emoji in .ic so every symbol follows the icon scale ===== */
const EMO_ONE='(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F)'; const EMO_RE=new RegExp('('+EMO_ONE+'(?:\\uFE0F|\\u200D(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic})\\uFE0F?|[\\u{1F3FB}-\\u{1F3FF}])*)','gu'); const EMO_TEST=new RegExp(EMO_ONE,'u');
function wrapEmoji(root){
  if(!root||root.nodeType===3&&!root.parentNode) return;
  const base=root.nodeType===3?root.parentNode:root;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!EMO_TEST.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
    const pe=n.parentElement; if(!pe||pe.closest('.ic,script,style,textarea,option,select,pre,title,svg')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  const list=[]; let n; if(root.nodeType===3){ const pe=root.parentElement; if(pe&&EMO_TEST.test(root.nodeValue||'')&&!pe.closest('.ic,script,style,textarea,option,select,pre,title,svg')) list.push(root); } else while((n=w.nextNode())) list.push(n);
  list.forEach(n=>{
    const parts=n.nodeValue.split(EMO_RE); if(parts.length<2) return;
    const f=document.createDocumentFragment();
    parts.forEach((x,i)=>{ if(!x) return; if(i%2){ const sp=document.createElement('span'); sp.className='ic'; sp.setAttribute('aria-hidden','true'); if(x==='\u2605'||x==='\u2606'){ sp.className='ic st'+(x==='\u2605'?' f':''); sp.innerHTML=starSVG(x==='\u2605'); } else sp.textContent=x; f.appendChild(sp); } else f.appendChild(document.createTextNode(x)); });
    n.parentNode.replaceChild(f,n);
  });
}
wrapEmoji(document.body);
new MutationObserver(ms=>{ for(const m of ms){ m.addedNodes.forEach(nd=>{ if(nd.nodeType===1||nd.nodeType===3) wrapEmoji(nd); }); } }).observe(document.body,{childList:true,subtree:true});

   +'Format: {"affinity": <the hero\u2019s current affinity number shown on the screen, or 0 if not shown>, "items": {"lollipop": {"count": <number>, "favorite": <true|false>}, ...}}\n'
   +'There are 12 gift items. Use exactly these keys:\n'+list+'\n'
   +'"count" is the number shown on that item. "favorite" is true only for the item that has a heart badge (at most one per tier). If a number is unreadable, use null instead of guessing.';
}
function toggleAIPreview(){ const pre=document.getElementById('aiPreview'), b=document.getElementById('aiPrevBtn'); const show=pre.hidden; pre.hidden=!show; if(show) pre.textContent=aiPromptText(); b.textContent=t(show?'aiHide':'aiPreview'); b.setAttribute('data-t',show?'aiHide':'aiPreview'); }
function copyAIPrompt(btn){
  const txt=aiPromptText(), done=()=>{ const o=btn.textContent; btn.textContent=t('aiCopied'); setTimeout(()=>{ btn.textContent=t('aiCopy'); },1500); };
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }catch(e){ fallbackCopy(txt,done); }
}
function fallbackCopy(txt,done){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
function importAI(){
  const st=document.getElementById('aiStatus'), raw=document.getElementById('aiText').value;
  const a=raw.indexOf('{'), b=raw.lastIndexOf('}'); let o=null;
  if(a>=0&&b>a){ try{ o=JSON.parse(raw.slice(a,b+1)); }catch(e){} }
  const items=o&&(o.items||o);
  if(!items||typeof items!=='object'){ st.className='scan-status bad'; st.textContent=t('aiBad'); return; }
  let n=0, f=0;
  Object.keys(itemState).forEach(k=>{ const v=items[k]; if(v===undefined||v===null) return; const c=(typeof v==='object')?v.count:v; if(c!==null&&c!==undefined&&isFinite(+c)){ itemState[k].cap=Math.max(0,Math.round(+c)); n++; } });
  TIER_ITEMS.forEach(list=>{ const fk=list.find(k=>items[k]&&typeof items[k]==='object'&&items[k].favorite===true); if(fk){ list.forEach(k=>itemState[k].favorite=(k===fk)); f++; } });
  const av=Math.max(0,Math.round(+(o&&o.affinity)||0)); if(av>0){ currentAff=av; document.getElementById('curAff').value=av; renderTargets(); }
  if(!n){ st.className='scan-status bad'; st.textContent=t('aiBad'); return; }
  renderVars(); queueSave(); st.className='scan-status ok';
  st.textContent=t('aiDone').replace('{n}',n).replace('{f}',f).replace('{v}',currentAff);
}

function tipBtn(k){ return `<span class="tip"><button type="button" class="tip-btn" aria-expanded="false" aria-label="info" data-tip="${esc(t(k))}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></button></span>`; }
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function closeTips(){ document.querySelectorAll('.tip-pop').forEach(e=>e.remove()); document.querySelectorAll('.tip-btn[aria-expanded=true]').forEach(b=>b.setAttribute('aria-expanded','false')); }
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.tip-btn');
  if(!b){ if(!e.target.closest||!e.target.closest('.tip-pop')) closeTips(); return; }
  e.preventDefault(); e.stopPropagation();
  const was=b.getAttribute('aria-expanded')==='true'; closeTips(); if(was) return;
  const pop=document.createElement('div'); pop.className='tip-pop'; pop.setAttribute('role','tooltip'); pop.textContent=b.dataset.tip;
  document.body.appendChild(pop); b.setAttribute('aria-expanded','true');
  const r=b.getBoundingClientRect(), w=Math.min(280,innerWidth-24); pop.style.width=w+'px';
  let x=Math.max(12,Math.min(r.left+r.width/2-w/2,innerWidth-w-12)), y=r.bottom+8;
  pop.style.left=x+'px'; pop.style.top=y+'px';
  if(y+pop.offsetHeight>innerHeight-8) pop.style.top=Math.max(8,r.top-pop.offsetHeight-8)+'px';
},true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeTips(); });
window.addEventListener('scroll',closeTips,{passive:true});

}

/* stage list: one row per step, a stacked bar of green / purple / gold gifts, affinity gained on the right */
let stgMode='step';
function setStgMode(m){ stgMode=m; calculateAll(); }
/* one thin bar per tier: how much of that tier's final total has been used (solid = up to this row; in "per stage" mode the part before this stage is faded) */
function stageVisual(stages,sum,pts,useHTML){
  const cum=[]; let c=[0,0,0],cp=0;
  stages.forEach(g=>{ const prev=c.slice(),pp=cp; c=c.map((v,i)=>v+g.d[i]); cp+=g.pts; cum.push({d:c.slice(),prev,pts:cp,pp}); });
  const T=stgMode==='total';
  const pct=v=>pts>0?Math.round(v/pts*100):0;
  const chips=(d,delta)=>[0,1,2].filter(i=>d[i]>0).map(i=>`<span class="stg-chip t${i}">${tierLabel(i)} ${delta?'+':''}${d[i]}${T&&sum[i]?`<small>/${sum[i]}</small>`:''}</span>`).join('')||'<span class="stg-chip none">\u2014</span>';
  const line=(i,r,dv)=>{ if(!sum[i]) return ''; const w1=r.prev[i]/sum[i]*100, w2=r.d[i]/sum[i]*100, use=T?r.d[i]:dv[i];
    const chip=`<span class="stg-chip t${i}${use?'':' zero'}">${tierLabel(i)} ${T?'':(use?'+':'')}${use}${T?`<small>/${sum[i]}</small>${dv[i]>0?`<em class="stg-add">+${dv[i]}</em>`:''}`:''}</span>`;
    const bar=`<div class="stg-tb"><i class="t${i}${T?'':' old'}" style="width:${T?w2:w1}%"></i>${T?'':`<i class="t${i}" style="width:${Math.max(r.d[i]-r.prev[i]>0?1.5:0,(r.d[i]-r.prev[i])/sum[i]*100)}%"></i>`}</div>`;
    return `<div class="stg-line">${chip}${bar}</div>`; };
  const start=stages.length?stages[0].from:0;
  const seg=`<div class="seg stg-seg"><button class="${T?'':'on'}" onclick="setStgMode('step')">${esc(t('stgStep'))}</button><button class="${T?'on':''}" onclick="setStgMode('total')">${esc(t('stgCum'))}</button></div>`;
  return seg+`<div class="stg-list">${stages.map((g,ix)=>{const r=cum[ix];const d=T?r.d:g.d;
    return `<div class="stg-row"><div class="stg-top"><b class="stg-lab">${T?start:g.from} \u2192 ${g.to}</b><span class="stg-pts">+${T?r.pts:g.pts} \u00b7 ${pct(r.pts)}%</span></div><div class="stg-lines">${[0,1,2].map(i=>line(i,r,g.d)).join('')}</div></div>`}).join('')}
    <div class="stg-row stg-total"><div class="stg-top"><b class="stg-lab">${t('stageSum')}</b><span class="stg-pts">+${pts} \u00b7 100%</span></div><div class="stg-chips">${chips(sum,!T)}</div>${useHTML||''}</div></div>`;
}

/* ===== settings: theme ===== */
const THEME_KEY='heroAffinityCalc.theme';
function getTheme(){ try{ const v=localStorage.getItem(THEME_KEY); return (v==='light'||v==='dark')?v:'auto'; }catch(e){ return 'auto'; } }
function setTheme(m){
  const r=document.documentElement;
  if(m==='light'||m==='dark') r.setAttribute('data-theme',m); else r.removeAttribute('data-theme');
  try{ if(m==='auto') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY,m); }catch(e){}
  document.querySelectorAll('[data-theme-btn]').forEach(b=>{ const on=b.getAttribute('data-theme-btn')===m; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  document.querySelectorAll('meta[name="theme-color"]:not(#metaPal)').forEach(x=>x.remove());
  if(m!=='auto'){ const x=document.createElement('meta'); x.name='theme-color'; x.content=m==='dark'?'#16181d':'#f6f7f9'; document.head.appendChild(x); }
  PAL.refresh(); renderSwatches();
}
const COLOR_KEYS=['cBlue','cCream','cPink','cRose','cOrange','cGreen','cTeal','cSky','cPurple','cCoffee','cGraphite'];
function swatchPair(id){ const dark=PAL.isDark(); let h,S; if(id.indexOf('custom:')===0){ const x=PAL.hexHsl(id.slice(7))||[330,60]; h=x[0]; S=Math.max(12,Math.min(95,x[1])); } else { const r=PAL.PRE.find(x=>x[0]===id); h=r[1]; S=r[2]; } const soft=dark?`hsl(${h},${Math.round(Math.max(15,Math.min(45,S*.4)))}%,34%)`:`hsl(${h},${Math.round(Math.max(25,Math.min(75,S*.65)))}%,80%)`; return [soft,soft]; }
function swStyle(id){ const [bg,ac]=swatchPair(id); return `--sw-bg:${bg};--sw:${ac}`; }
function renderSwatches(){
  const g=document.getElementById('swGrid'); if(!g) return;
  const cur=PAL.curColor(), isC=cur.indexOf('custom:')===0, hex=isC?cur.slice(7):'#e0457b';
  g.innerHTML=PAL.PRE.map((r,i)=>`<button type="button" class="sw${cur===r[0]?' on':''}" style="${swStyle(r[0])}" data-c="${r[0]}" aria-label="${esc(t(COLOR_KEYS[i]))}" aria-pressed="${cur===r[0]}" title="${esc(t(COLOR_KEYS[i]))}" onclick="pickColor('${r[0]}')"></button>`).join('')
   +`<label class="sw sw-custom${isC?' on':''}" title="${esc(t('themeCustom'))}" style="${isC?swStyle('custom:'+hex):''}"><input type="color" id="swPick" value="${hex}" aria-label="${esc(t('themeCustom'))}" oninput="pickCustom(this.value,false)" onchange="pickCustom(this.value,true)"><svg class="sw-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></label>`;
  const nm=document.getElementById('swName'); if(nm) nm.textContent='\u00b7 '+(isC?t('themeCustom')+' '+hex.toUpperCase():t(COLOR_KEYS[PAL.PRE.findIndex(r=>r[0]===cur)]));
}
function pickColor(id){ PAL.setColor(id); renderSwatches(); }
function pickCustom(hex,final){ PAL.setColor('custom:'+hex); const w=document.querySelector('.sw-custom'); if(w){ w.classList.add('on'); const pr=swatchPair('custom:'+hex); w.style.setProperty('--sw-bg',pr[0]); w.style.setProperty('--sw',pr[1]); } document.querySelectorAll('.sw:not(.sw-custom)').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');}); const nm=document.getElementById('swName'); if(nm) nm.textContent='\u00b7 '+t('themeCustom')+' '+hex.toUpperCase(); }
function clampZ(v){ v=Math.round(Number(v)); return isFinite(v)?Math.max(70,Math.min(150,v)):100; }
function keepPos(id,fn){ const el=document.getElementById(id), y0=el?el.getBoundingClientRect().top:0; fn(); if(el){ const d=el.getBoundingClientRect().top-y0; if(Math.abs(d)>1) window.scrollBy(0,d); } }
function pickSize(z){ keepPos('sizeSeg',()=>{PAL.setSize(clampZ(z)); renderSize();}); }
function pickText(z){ keepPos('textSeg',()=>{PAL.setText(clampZ(z)); renderSize();}); }
function customZ(id,v,fin){ keepPos(id,()=>customZ0(id,v,fin)); }
function customZ0(id,v,fin){ const z=clampZ(v), isT=id==='textSeg'; (isT?PAL.setText:PAL.setSize)(z); const box=document.getElementById(id+'Cu'); if(!box) return; const r=box.querySelector('input[type=range]'), n=box.querySelector('input[type=number]'); if(r&&r.value!=z) r.value=z; if(n&&fin) n.value=z; if(fin) renderSize(true); else box.parentElement.querySelectorAll('.size-seg button').forEach(b=>{const on=parseInt(b.dataset.z,10)===z;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);}); }
function renderSize(){
  const mk=(id,cur,fn)=>{ const g=document.getElementById(id); if(!g) return; let cu=document.getElementById(id+'Cu'); if(!cu){ cu=document.createElement('div'); cu.id=id+'Cu'; cu.className='size-custom'; cu.innerHTML='<button type="button" class="zb zb-out" aria-label="\u2212">\u2212</button><input type="range" min="70" max="150" step="1" aria-label="%"><button type="button" class="zb zb-in" aria-label="+">+</button><label class="size-num"><input type="number" min="70" max="150" step="1" inputmode="numeric"><span>%</span></label>'; g.after(cu); const r=cu.querySelector('input[type=range]'), n=cu.querySelector('input[type=number]'); r.addEventListener('input',()=>{n.value=r.value;customZ(id,r.value,false)}); r.addEventListener('change',()=>customZ(id,r.value,true)); n.addEventListener('change',()=>customZ(id,n.value,true)); cu.querySelector('.zb-out').addEventListener('click',()=>customZ(id,(parseInt(r.value,10)||100)-5,true)); cu.querySelector('.zb-in').addEventListener('click',()=>customZ(id,(parseInt(r.value,10)||100)+5,true)); n.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();customZ(id,n.value,true);n.blur();}}); } cu.querySelector('input[type=range]').value=cur; if(document.activeElement!==cu.querySelector('input[type=number]')) cu.querySelector('input[type=number]').value=cur; g.innerHTML=[70,85,100,115,130].map(z=>`<button type="button" class="${z===cur?'on':''}" aria-pressed="${z===cur}" data-z="${z}" onclick="${fn}(${z})">${id==='textSeg'?`<span class="sz-ic sz-a" style="font-size:${Math.round(z*0.16)}px">A</span>`:`<span class="sz-ic">${(()=>{const w=Math.round(z*0.2),x=(28-w)/2;return `<svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="${x}" y="${x}" width="${w}" height="${w}" rx="3"/><path d="M${x} ${x+Math.max(5,Math.round(w*0.28))}H${x+w}"/></svg>`})()}</span>`}<small>${z}%</small></button>`).join(''); };
  mk('textSeg',PAL.curText(),'pickText'); mk('sizeSeg',PAL.curSize(),'pickSize');
}
function renderSettingsText(){
  { const a=document.getElementById('t_saveIntro'); if(a) a.textContent=t('saveIntro'); const b=document.getElementById('t_saveInclude'); if(b) b.textContent=t('saveInclude'); renderSaveParts(); }
  const set=(id,k)=>{ const e=document.getElementById(id); if(e) e.textContent=t(k); };
  { const e=document.getElementById('t_setTitle'); if(e) e.innerHTML=GEAR_SVG+esc(t('setTitle')); }; set('t_setLang','setLang'); set('t_setTheme','setTheme'); set('t_aboutTitle','aboutTitle'); set('t_setMode','setMode'); set('t_setColor','setColor'); set('t_setSize','setSize'); set('t_setText','setText');  renderSwatches(); renderSize();
  document.querySelectorAll('[data-theme-btn]').forEach(b=>{ b.textContent=t('theme'+b.getAttribute('data-theme-btn').replace(/^./,c=>c.toUpperCase())); });
  const ab=document.getElementById('t_aboutBody');
  if(ab) ab.innerHTML='<b>V2</b> \u00b7 '+esc(t('unofficial'))+'<br><a href="https://github.com/ghg-jam/PBI-hero-affinity-calculator" target="_blank" rel="noopener">'+esc(t('aboutRepo'))+'</a> \u00b7 <a href="https://github.com/ghg-jam/PBI-hero-affinity-calculator/issues" target="_blank" rel="noopener">'+esc(t('reportBug'))+'</a>';
}

function cloneStyled(src){
  const c=src.cloneNode(false);
  if(src.nodeType!==1) return c;
  const css=(cs,extra)=>{ let o=''; for(const k of cs) o+=k+':'+cs.getPropertyValue(k)+';'; return o+(extra||''); };
  ['onclick','onchange','oninput','onkeydown','onpointerdown','id'].forEach(a=>c.removeAttribute(a));
  c.setAttribute('style',css(getComputedStyle(src)));
  for(const pe of ['::before','::after']){
    const ps=getComputedStyle(src,pe), ct=ps.content;
    if(!ct||ct==='none'||ct==='normal') continue;
    const sp=document.createElement('span'); sp.setAttribute('style',css(ps)); sp.textContent=ct.replace(/^["']|["']$/g,'').replace(/\\(["'\\])/g,'$1');
    if(pe==='::before') c.insertBefore(sp,c.firstChild); else c.appendChild(sp);
  }
  src.childNodes.forEach(ch=>{ if(ch.nodeType===1){ if(!/^(SCRIPT|STYLE)$/.test(ch.tagName)) c.appendChild(cloneStyled(ch)); } else if(ch.nodeType===3) c.appendChild(ch.cloneNode()); });
  return c;
}
async function saveViewImage(btn){
  const card=btn.closest('.res-data,.res-summary'), msg=btn.parentElement&&btn.parentElement.querySelector('.scan-status'), say=(x,cls)=>{ if(msg){ msg.className='scan-status '+(cls||''); msg.textContent=x; } };
  const src=card&&card.querySelector('.res-export'); if(!src) return;
  const R=document.documentElement, zoom=R.style.zoom; R.style.zoom='';
  let blob=null, svgText=null, w=0, h=0;
  try{
    const rs=getComputedStyle(R), bg=rs.getPropertyValue('--panel').trim()||'#fff', fg=rs.getPropertyValue('--text').trim()||'#111', mu=rs.getPropertyValue('--muted').trim()||'#666';
    const vname=card.dataset.vname||t((RES_VIEWS.find(v=>v[0]===curResView())||RES_VIEWS[0])[1]);
    const wrap=document.createElement('div'); const pad=20; w=Math.ceil(src.getBoundingClientRect().width)+pad*2;
    wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
    wrap.setAttribute('style','box-sizing:border-box;width:'+w+'px;padding:'+pad+'px;background:'+bg+';color:'+fg+';font-family:'+getComputedStyle(document.body).fontFamily+';');
    const ti=document.createElement('div'); ti.setAttribute('style','font-weight:700;font-size:16px;margin-bottom:12px'); ti.textContent=(card.dataset.title||'')+' \u00b7 '+vname; wrap.appendChild(ti);
    wrap.appendChild(cloneStyled(src));
    const ft=document.createElement('div'); ft.setAttribute('style','font-size:11px;color:'+mu+';margin-top:14px'); ft.textContent='Hero Affinity Level Calculator \u00b7 '+new Date().toISOString().slice(0,10); wrap.appendChild(ft);
    const probe=wrap.cloneNode(true); probe.style.cssText+='position:fixed;left:-99999px;top:0;'; document.body.appendChild(probe); h=Math.ceil(probe.getBoundingClientRect().height); probe.remove();
    svgText='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject x="0" y="0" width="100%" height="100%">'+new XMLSerializer().serializeToString(wrap)+'</foreignObject></svg>';
  }catch(e){ svgText=null; }
  finally{ R.style.zoom=zoom; }
  if(!svgText){ say(t('imgFail'),'bad'); return; }
  const stem=((card.dataset.title||'combo')+'-'+(card.dataset.vname?'gap':curResView())).replace(/[^\w\u4e00-\u9fff-]+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10);
  try{
    const img=new Image(); await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgText); });
    const sc=2, cv=document.createElement('canvas'); cv.width=w*sc; cv.height=h*sc; const cx=cv.getContext('2d'); cx.scale(sc,sc); cx.drawImage(img,0,0,w,h);
    blob=await new Promise((ok,no)=>{ try{ cv.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'); }catch(e){ no(e); } });
  }catch(e){ blob=null; }
  let name=stem+'.png';
  if(!blob){ blob=new Blob([svgText],{type:'image/svg+xml'}); name=stem+'.svg'; }
  try{
    if(window.claude&&claude.use){ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:name,data:blob}); say(t('saveDone'),'ok'); return; } }
  }catch(e){ if(e&&e.code==='declined') return; }
  try{
    const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); say(t('saveDone'),'ok');
  }catch(e){ say(t('imgFail'),'bad'); }
}

const SAVE_KEY='heroAffinityCalc.save.v1';

function renderSaveParts(){
  const g=document.getElementById('saveParts'); if(!g) return;
  const names={gifts:'savePartGifts',targets:'savePartTargets',combos:'savePartCombos',prefs:'savePartPrefs'};
  g.innerHTML=SAVE_PARTS.map(k=>`<label class="chk-chip${saveSel.has(k)?' on':''}"><input type="checkbox" ${saveSel.has(k)?'checked':''} onchange="toggleSavePart('${k}',this.checked)"><span>${t(names[k])}</span></label>`).join('');

function collectState(parts){
  const all=!parts, has=k=>all||parts.indexOf(k)>=0, o={app:'hero-affinity-calculator',version:1,savedAt:new Date().toISOString()};
  if(all||has('prefs')) o.lang=curLang;
  if(has('prefs')&&!all) o.prefs={theme:getTheme(),color:PAL.curColor(),fontSize:PAL.curText(),uiSize:PAL.curSize()};
  if(has('gifts')){ o.items=Object.fromEntries(Object.entries(itemState).map(([k,v])=>[k,{cap:v.cap,favorite:v.favorite}])); o.currentAff=currentAff; }
  if(has('targets')){ o.presets=[...selectedPresets]; o.customTargets=customTargets.slice(); o.showEarlier=showEarlier; o.finalGoal=finalGoal; }
  if(has('combos')){ o.combos=JSON.parse(JSON.stringify(combos)); o.comboSeq=comboSeq; }
  if(!all) o.parts=parts.slice();
  return o;
}
function num(v,d,min,max){ v=Number(v); if(!isFinite(v)) return d; if(min!=null&&v<min) v=min; if(max!=null&&v>max) v=max; return v; }
function applyState(o,parts){
  if(!o||o.app!=='hero-affinity-calculator'||typeof o!=='object') throw new Error('bad');
  const want=k=>!parts||parts.indexOf(k)>=0, loaded=[];
  if(want('prefs')&&o.lang&&LANG[o.lang]){ curLang=o.lang; loaded.push('prefs'); }
  if(want('prefs')&&o.prefs&&typeof o.prefs==='object'){
    const q=o.prefs; if(loaded.indexOf('prefs')<0) loaded.push('prefs');
    if(q.theme==='light'||q.theme==='dark'||q.theme==='auto') setTheme(q.theme);
    if(typeof q.color==='string'&&(q.color==='blue'||PAL.PRE.some(x=>x[0]===q.color)||/^custom:#[0-9a-f]{6}$/i.test(q.color))) PAL.setColor(q.color);
    if(isFinite(+q.fontSize)) PAL.setText(Math.max(70,Math.min(150,Math.round(+q.fontSize))));
    if(isFinite(+q.uiSize)) PAL.setSize(Math.max(70,Math.min(150,Math.round(+q.uiSize))));
    renderSwatches(); renderSize();
  }
  if(want('gifts')&&o.items&&typeof o.items==='object'){
    loaded.push('gifts');
    Object.keys(itemState).forEach(k=>{ const v=o.items[k]; if(v){ itemState[k].cap=Math.round(num(v.cap,0,0,1e7)); itemState[k].favorite=!!v.favorite; } });
    TIER_ITEMS.forEach(list=>{ let seen=false; list.forEach(k=>{ if(itemState[k].favorite){ if(seen) itemState[k].favorite=false; seen=true; } }); });
    currentAff=Math.round(num(o.currentAff,0,0,1e9));
  }
  if(want('targets')&&(o.presets||o.customTargets)){
    loaded.push('targets');
    selectedPresets=new Set((Array.isArray(o.presets)?o.presets:[]).filter(k=>PRESET_LISTS[k]));
    customTargets=[...new Set((Array.isArray(o.customTargets)?o.customTargets:[]).map(Number).filter(v=>isFinite(v)&&v>0))];
    showEarlier=false; finalGoal=Math.max(0,Math.round(num(o.finalGoal,0,0,1e9)));
  }
  const modes=['auto','limit','even'], conds=['always','final','fromValue'];
  if(want('combos')&&Array.isArray(o.combos)){
  loaded.push('combos');
  combos=o.combos.slice(0,20).map((c,i)=>{
    let a=Math.round(num(c.a,0,0,2)), b=Math.round(num(c.b,1,0,2)); if(a===b||a===2||b===2){ a=0; b=1; }
    const nfItems={}, itemMax={}; Object.keys(itemState).forEach(k=>{ const m=c.itemMax&&c.itemMax[k]; if(m!==undefined&&m!==null&&m!==''&&isFinite(+m)) itemMax[k]=Math.max(0,Math.round(+m)); else if(c.nfMode==='specific'&&c.nfItems&&c.nfItems[k]===false) itemMax[k]=0; });
    return {id:Math.round(num(c.id,i,0,1e6)),name:(c.name==null||/^Combo \d+$/.test(String(c.name).trim()))?'':String(c.name).slice(0,40),a,b,dir:'A-B',lo:Math.max(0,num(c.lo,0)),hi:Math.max(0,num(c.hi,25),Math.max(0,num(c.lo,0))),
      cond:conds.includes(c.cond)?c.cond:'always',condVal:num(c.condVal,0),tol:num(c.tol,10,0),useNonFavorite:!!c.useNonFavorite,order:orderFull(c.order)||(c.goldFirst?'Y>P>G':''),
      histOverride:(Array.isArray(c.histOverride)&&c.histOverride.length===3)?c.histOverride.map(v=>Math.max(0,Math.round(num(v,0)))):null,nfMode:modes.includes(c.nfMode)?c.nfMode:'auto',itemMax,nfLimit:[0,1,2].map(j=>{ const v=c.nfLimit&&c.nfLimit[j]; return (v===''||v==null)?'':Math.max(0,num(v,0)); }),nfItems};
  });
  comboSeq=Math.max(0,...combos.map(c=>c.id+1),num(o.comboSeq,0,0,1e6));
  }
  computeTargets(); scanWarn=new Set();
  document.documentElement.dir=(curLang==='ar')?'rtl':'ltr';
  document.getElementById('langSelect').value=curLang;
  document.getElementById('curAff').value=currentAff||'';
  document.getElementById('results').innerHTML='';
  applyStatic(); renderVars(); renderPresets(); renderTargets(); renderCombos(); renderSaveParts();
  return loaded;
}
function saveMsg(text,cls){ const el=document.getElementById('saveStatus'); if(el){ el.className='scan-status '+(cls||''); el.textContent=text; } }
function autosave(){
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(collectState()));
    const d=new Date(), hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    saveMsg(t('saveAuto').replace('{t}',hh),''); }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(autosave,500); }
['change','click','input'].forEach(ev=>document.addEventListener(ev,queueSave,true));
window.addEventListener('pagehide',()=>{ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(collectState())); }catch(e){} });
async function downloadSave(){
  const sel=savePartsSel(); if(!sel.length){ saveMsg(t('saveNone'),'bad'); return; }
  const data=JSON.stringify(collectState(sel),null,1), d=new Date();
  const fname='hero-affinity-'+(sel.length===SAVE_PARTS.length?'save':sel.join('-'))+'-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  try{
    if(window.claude&&claude.use){ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:fname,data}); saveMsg(t('saveDone'),'ok'); return; } }
  }catch(e){ if(e&&e.code==='declined') return; }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'})), a=document.createElement('a');
    a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    saveMsg(t('saveDone'),'ok');
  }catch(e){ saveMsg(t('saveBad'),'bad'); }
}
function partNames(list){ const n={gifts:'savePartGifts',targets:'savePartTargets',combos:'savePartCombos',prefs:'savePartPrefs'}; return list.map(k=>t(n[k])).join(', '); }
async function loadSaveFile(file){
  if(!file) return;
  try{ const o=JSON.parse(await file.text()); const got=applyState(o,savePartsSel()); autosave(); saveMsg(got.length?t('saveLoadedParts').replace('{p}',partNames(got)):t('saveNoMatch'),got.length?'ok':'bad'); }
  catch(e){ saveMsg(t('saveBad'),'bad'); }
}
function resetAll(){
  const sel=savePartsSel(); if(!sel.length){ saveMsg(t('saveNone'),'bad'); return; }
  const btn=document.getElementById('t_saveReset');
  if(!resetArmed){ resetArmed=true; btn.textContent=t('saveConfirm'); setTimeout(()=>{ resetArmed=false; btn.textContent=t('saveReset'); },4000); return; }
  resetArmed=false; btn.textContent=t('saveReset');
  const has=k=>sel.indexOf(k)>=0;
  if(has('gifts')){ Object.keys(itemState).forEach(k=>{ itemState[k].cap=0; itemState[k].favorite=false; }); currentAff=0; document.getElementById('curAff').value=''; }
  if(has('targets')){ selectedPresets=new Set(['ph1','ph2']); customTargets=[]; showEarlier=false; finalGoal=0; }
  if(has('combos')){ combos=[]; comboSeq=0; }
  if(has('prefs')){ setTheme('auto'); PAL.setColor('blue'); PAL.setText(100); PAL.setSize(100); curLang=(navigator.language||'en').slice(0,2)==='zh'?curLang:'en'; }
  computeTargets(); if(has('combos')){ addCombo(); }
  document.getElementById('results').innerHTML='';
  scanWarn=new Set(); document.getElementById('langSelect').value=curLang; applyStatic(); renderVars(); renderPresets(); renderTargets(); renderCombos(); renderSwatches(); renderSize(); renderSaveParts();
  if(sel.length===SAVE_PARTS.length){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
  autosave();
  saveMsg(t('saveResetDone'),'ok');
}
function bootLoad(){
  try{ const raw=localStorage.getItem(SAVE_KEY); if(raw) applyState(JSON.parse(raw)); }catch(e){}
}
let selectedPresets = new Set(['ph1','ph2']);
let customTargets = [];
let targets = [];
let targetWeights = {};
function computeTargets(){
  const map = {};
  selectedPresets.forEach(key=>{
    PRESET_LISTS[key].forEach(v=>{ map[v]=(map[v]||0)+1; });
  });
  const all = new Set([...Object.keys(map).map(Number), ...customTargets]);
  targets = [...all].sort((a,b)=>a-b);
  targetWeights = {};
  targets.forEach(v=> targetWeights[v]=map[v]||0);
}
let currentAff = 0, showEarlier = false, finalGoal = 0;
/* final goal: 0 = the highest target; otherwise the plan ends (exactly) at this target */
function fg(){ return (finalGoal && targets.includes(finalGoal)) ? finalGoal : (targets.length?targets[targets.length-1]:0); }
function activeTargets(){ const f=fg(); return targets.filter(v=>v<=f); }
function setFinal(v){ finalGoal=+v||0; if(finalGoal===(targets[targets.length-1]||0)) finalGoal=0; renderTargets(); queueSave(); }
function renderFinalSelect(){
  const el=document.getElementById('finalGoal'); if(!el) return;

}

/* ===== V2 affinity progress bar ===== */
function progTracks(){
  const tr=[];
  PRESET_ORDER.filter(k=>selectedPresets.has(k)).forEach(k=>{ const nodes=[...new Set(PRESET_LISTS[k].filter(v=>v>0&&v<=fg()))].sort((a,b)=>a-b); if(nodes.length) tr.push({title:presetName(k),nodes}); });
  const cu=[...new Set(customTargets.filter(v=>v>0&&v<=fg()))].sort((a,b)=>a-b); if(cu.length) tr.push({title:t('pgCustom'),nodes:cu});
  return tr;
}
function trackHTML(tr,A,rowsByT){
  const nodes=tr.nodes, n=nodes.length, last=nodes[n-1];
  const pos=v=>{ if(v<=0) return 0; if(v>=last) return 100; const i=nodes.findIndex(x=>v<x), lo=i===0?0:nodes[i-1], hi=nodes[i]; return ((i+(v-lo)/(hi-lo))/n*100); };
  const aPos=pos(A), pct=Math.floor(aPos+1e-9);
  let planEnd=aPos;
  if(rowsByT){ for(let i=0;i<n;i++){ const v=nodes[i]; if(v<=A) continue; const r=rowsByT[v]; if(r&&r.overage>=0) planEnd=((i+1)/n*100); else break; } }
  const next=nodes.find(v=>v>A), nxI=nodes.indexOf(next), step=n>7?Math.ceil(n/6):1;
  const dots=[{v:0,i:-1}].concat(nodes.map((v,i)=>({v,i}))).map(d=>{
    const x=(d.i+1)/n*100, v=d.v; let cls='pend';
    if(v<=A) cls='done';
    else if(rowsByT&&rowsByT[v]){ const r=rowsByT[v], ov=r.overage; cls=ov<0?'short':(ov===0?'exact':(r.near?'near':'over')); }
    const isNx=v===next, nearNx=nxI>=0&&Math.abs(d.i-nxI)===1;
    const show=isNx||(!nearNx&&(d.i<0||d.i===n-1||(d.i+1)%step===0));
    const lab=show?`<span class="pb-lab${isNx?' nx':''}" style="left:${x}%">${v}</span>`:'';
    return `<i class="pb-node ${cls}${isNx?' next':''}" style="left:${x}%" title="${v}"></i>${lab}`;
  }).join('');
  const now=A>0?`<span class="pb-now${aPos>90?' r':(aPos<10?' l':'')}" style="left:${aPos}%">${A}</span>`:'';
  const sum=A>=last?t('progDone'):t('progNext').replace('{t}',next).replace('{n}',next-A);
  return `<div class="pb-grp"><div class="pb-gtitle">${tr.title}</div><div class="pb-head"><div class="pb-pct">${pct}<small>%</small></div><div class="pb-frac"><b>${A>last?last:A}</b> / ${last}</div></div><div class="pbar">${now}<div class="pb-track"><div class="pb-done" style="width:${aPos}%"></div>${planEnd>aPos?`<div class="pb-plan" style="left:${aPos}%;width:${planEnd-aPos}%"></div>`:''}</div>${dots}</div><div class="pb-sum">${sum}</div></div>`;
}
function progressHTML(A,rowsByT){
  const trs=progTracks(); if(!trs.length) return '';
  const legend=rowsByT?`<div class="pb-legend"><span><i style="border-color:#2e9e57;background:#2e9e57"></i>${t('pgLgDone')}</span><span><i style="border-color:#2e9e57;background:rgba(46,158,87,.25)"></i>${t('pgLgExact')}</span><span><i style="border-color:#d9a400;background:rgba(217,164,0,.25)"></i>${t('pgLgNear')}</span><span><i style="border-color:#8a8f98;background:rgba(138,143,152,.25)"></i>${t('pgLgOver')}</span><span><i style="border-color:#d64545;background:rgba(214,69,69,.3)"></i>${t('pgLgShort')}</span></div>`:'';

      <div class="rcards mob-only">${nowCard}${rowCardsHTML(rows,c,effTol)}</div>
      ${legendChips()}`;
    const gapBlock=rows.some((r,i)=>ruleActive(c,i))?`<div class="res-sub"><div class="block-title">\u2696\uFE0F ${t('gapChart')}</div><div class="res-actions"><button type="button" class="btn-light res-save" onclick="saveViewImage(this)">${DL_IC}<span>${t('saveImg')}</span></button><span class="scan-status" role="status"></span></div><div class="res-export"><div class="block-hint">${t('gapChartHint')}</div>${gapChart(rows,c,H,A)}</div></div>`:'';
    const card=(cls,html)=>{ const d=document.createElement('div'); d.className='panel res-card '+cls; d.dataset.combo=ci; d.innerHTML=html; return d; };
    cmp.push({ci,name:cname(c,ci),exact:exactN,near:nearN,short:shortN,ov:totOv,n:rows.length,fin:lastRow.counts.slice()});
    const planHTML=`${A>0?`<div class="block-title">🎯 ${t('planFrom')} (${A})</div>`:''}${adviceHTML(c,advice)}`;
    { const sm=card('res-summary',`<h2>${esc(cname(c,ci))}</h2>${sumStrip}${gapBlock}`); sm.dataset.title=cname(c,ci); sm.dataset.vname=t('gapChart'); resBox.appendChild(sm); }
    if(histBox) resBox.appendChild(card('res-input',histBox));
    if(adviceHTML(c,advice).replace(/<[^>]*>/g,'').trim()) resBox.appendChild(card('res-plan',planHTML));
    { const dlIc=DL_IC; const rd=card('res-data',`${viewPicker()}<div class="res-actions"><button type="button" class="btn-light res-save" onclick="saveViewImage(this)">${dlIc}<span>${t('saveImg')}</span></button><span class="scan-status" role="status"></span></div><div class="res-export">${resSection}</div>`); rd.dataset.title=cname(c,ci); resBox.appendChild(rd); }
  });
  buildResTabs(resBox,cmp);
}
let resTabSel=0;
function setResTab(v){ resTabSel=v; const box=document.getElementById('results'); if(!box) return; applyResTab(box); const act=box.querySelector('.res-tabs [aria-selected=true]'); if(act&&act.scrollIntoView) act.scrollIntoView({block:'nearest',inline:'center'}); }
function applyResTab(box){
  const sel=String(resTabSel);
  [...box.children].forEach(el=>{ if(el.classList.contains('res-tabs')) return; el.classList.toggle('res-off',el.dataset.combo!==sel); });
  box.querySelectorAll('.res-tabs button').forEach(b=>{ const on=b.dataset.tab===sel; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; });
}
function buildResTabs(box,cmp){
  if(cmp.length<2){ return; }
  if(resTabSel!=='cmp'&&!(resTabSel>=0&&resTabSel<combos.length)) resTabSel=0;
  const best=cmp.reduce((m,x)=>(!m||x.short<m.short||(x.short===m.short&&x.ov<m.ov))?x:m,null);
  const chips=x=>[0,1,2].map(i=>`<span class="fc${i}">${tierLabel(i)} <b>${x.fin[i]}</b></span>`).join(' ');
  const cmpHTML=`<h2>${t('resCompare')}</h2><div class="cmp-list">${cmp.map(x=>`<button type="button" class="cmp-item${x===best?' best':''}" onclick="setResTab(${x.ci})"><div class="cmp-head"><b>${esc(x.name)}</b>${x===best?`<span class="cmp-best">${t('resBest')}</span>`:''}</div><div class="cmp-stats"><span><small>${t('exact')}</small><b>${x.exact}/${x.n}</b></span><span><small>${t('within')}</small><b>${x.near}/${x.n}</b></span><span><small>${t('totalOv')}</small><b>${x.ov}</b></span><span class="${x.short?'bad':''}"><small>${t('shortfall')}</small><b>${x.short}</b></span></div><div class="cmp-fin">${chips(x)}</div></button>`).join('')}</div>`;
  const cp=document.createElement('div'); cp.className='panel res-card res-cmp'; cp.dataset.combo='cmp'; cp.innerHTML=cmpHTML; box.appendChild(cp);
  const bar=document.createElement('div'); bar.className='res-tabs'; bar.setAttribute('role','tablist');
  bar.innerHTML=combos.map((c,i)=>`<button type="button" role="tab" data-tab="${i}" onclick="setResTab(${i})"><i>${i+1}</i><span>${esc(cname(c,i))}</span></button>`).join('')+`<button type="button" role="tab" data-tab="cmp" class="cmp-tab" onclick="setResTab('cmp')"><span>${t('resCompare')}</span></button>`;
  box.insertBefore(bar,box.firstChild);
  applyResTab(box);
}

computeTargets();
applyStatic(); setTheme(getTheme()); renderVars(); renderPresets(); renderTargets();
addCombo(); combos[0].lo=0; combos[0].hi=25;
renderCombos();
bootLoad();
</script>
