<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hero Affinity Level Calculator</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --text:#1a1a1a; --muted:#666; --border:#dcdfe3;
  --accent:#2f5fd6; --accent2:#eef2fc;
  --green:#c6efce; --greenT:#0f5c1f; --yellow:#ffeb9c; --yellowT:#7a5d00;
  --blue:#ddebf7; --blueT:#1d4e89; --danger:#d64545;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1f2226; --text:#e8e8e8; --muted:#9aa0a6; --border:#333a42;
    --accent:#6c93f5; --accent2:#222a3d;
    --green:#1e3a24; --greenT:#7be08c; --yellow:#3a3420; --yellowT:#e0c457;
    --blue:#1c2e3d; --blueT:#8fc2f5;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --text:#e8e8e8; --muted:#9aa0a6; --border:#333a42;
  --accent:#6c93f5; --accent2:#222a3d;
  --green:#1e3a24; --greenT:#7be08c; --yellow:#3a3420; --yellowT:#e0c457;
  --blue:#1c2e3d; --blueT:#8fc2f5;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);}
.wrap{max-width:980px;margin:0 auto;padding:20px 0 60px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
#langSelect{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;position:relative}
.panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.corner-note{display:block;text-align:right;font-size:10.5px;line-height:1.4;color:var(--muted);font-style:italic;margin-top:12px;padding-top:8px;border-top:1px dashed var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center}
th{color:var(--muted);font-weight:600;font-size:12px}
td input,.inline-input{width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.field{flex:1;min-width:110px}
select{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-light{background:var(--accent2);color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.tier-grid{grid-template-columns:1fr}}
.tier-card{border-radius:10px;padding:10px;text-align:center;border:2px solid var(--border)}
.tier-card.t0{background:linear-gradient(180deg,rgba(90,200,110,.14),transparent)}
.tier-card.t1{background:linear-gradient(180deg,rgba(150,90,220,.16),transparent)}
.tier-card.t2{background:linear-gradient(180deg,rgba(220,180,50,.18),transparent)}
.tier-badge{font-size:11px;font-weight:700;border-radius:12px;padding:2px 10px;display:inline-block;margin-bottom:6px}
.t0 .tier-badge{background:#3fae57;color:#fff}
.t1 .tier-badge{background:#8a5cd6;color:#fff}
.t2 .tier-badge{background:#c9a233;color:#fff}
.item-list{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:8px}
.item-row{display:flex;align-items:center;gap:6px}
.item-row img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:0 0 auto}
.item-row-name{font-size:11.5px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star-btn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);flex:0 0 auto;padding:0 2px;line-height:1}
.star-btn.is-fav{color:#e0b400}
.result-table small{opacity:.75;font-size:10px}
.item-qty{width:52px;flex:0 0 auto;padding:4px;text-align:center}
.combo-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px;background:var(--accent2)}
.combo-card h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.preset-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.preset-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer}
.preset-item input{flex:0 0 auto}
.preset-item .cnt{color:var(--muted);font-size:11px;margin-left:auto}
.targets-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--accent2);border:1px solid var(--border);border-radius:16px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip.weighted{background:var(--blue);border-color:var(--blueT)}
.chip .w-badge{font-size:10px;font-weight:700;color:var(--blueT)}
.chip button{background:none;border:none;color:var(--danger);font-size:13px;padding:0;line-height:1}
.add-target-row{display:flex;gap:6px}
.add-target-row input{flex:1}
.result-table td.exact{background:var(--green);color:var(--greenT);font-weight:600}
.result-table td.near{background:var(--yellow);color:var(--yellowT)}
.result-table td.short{background:rgba(214,69,69,.18);color:var(--danger);font-weight:600}
.gap-inband{background:var(--blue);color:var(--blueT)}
.summary{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.current-box{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:10px;background:var(--accent2)}
.current-box>label:first-child{font-size:13px;font-weight:700}
.current-box input[type=number]{width:140px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;font-weight:600}
.current-box .hint{flex:1 1 100%;font-size:11.5px;color:var(--muted)}
.switch-line{display:flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.chip.passed{opacity:.4;text-decoration:line-through}
.combo-head{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.combo-name{width:180px;font-weight:700}
.combo-block{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.block-title{font-size:13px;font-weight:700;margin-bottom:2px}
.block-hint{font-size:11.5px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{flex:1 1 auto;background:var(--bg);color:var(--text);border:1px solid var(--border);font-weight:500;padding:7px 10px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.combo-nonfav{margin:4px 2px 8px;font-size:13px}
.pick-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick{display:flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--border);border-radius:16px;padding:3px 10px 3px 6px;background:var(--bg);cursor:pointer}
.pick img{width:20px;height:20px;border-radius:4px}
.adv summary{font-size:12px;color:var(--muted);cursor:pointer}
.scan-box{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:12px;padding:10px 12px;border:1px dashed var(--border);border-radius:10px}
.scan-hint{font-size:11.5px;color:var(--muted);flex:1 1 220px}
.scan-status{flex:1 1 100%;font-size:12px;line-height:1.5}
.scan-status.ok{color:var(--greenT)}
.scan-status.bad{color:var(--danger)}
.item-row.warn .item-qty{border-color:#e0b400;background:rgba(224,180,0,.2)}
.footer-note{font-size:11px;color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="t_title"></h1>
      <p class="sub" id="t_sub"></p>
    </div>
    <select id="langSelect" onchange="setLang(this.value)">
      <option value="en">English</option>
      <option value="zhTW">繁體中文</option>
      <option value="zhCN">简体中文</option>
      <option value="ja">日本語</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="pt">Português</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ไทย</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ru">Русский</option>
      <option value="tr">Türkçe</option>
      <option value="it">Italiano</option>
      <option value="pl">Polski</option>
      <option value="ar">العربية</option>
      <option value="ko">한국어</option>
      <option value="fil">Filipino</option>
    </select>
  </div>

  <div class="panel">
    <h2 id="t_varsTitle"></h2>
    <div class="scan-box" id="scanBox" ondragover="event.preventDefault()" ondrop="event.preventDefault();handleScan(event.dataTransfer.files[0])">
      <button class="btn-light" id="t_scanBtn" onclick="document.getElementById('scanFile').click()"></button>
      <input type="file" id="scanFile" accept="image/*" hidden onchange="handleScan(this.files[0]);this.value=''">
      <span class="scan-hint" id="t_scanHint"></span>
      <div class="scan-status" id="scanStatus"></div>
    </div>
    <div id="varTable" class="tier-grid"></div>
    <div class="corner-note" id="t_varsNote"></div>
  </div>

  <div class="panel">
    <h2 id="t_targetsTitle"></h2>
    <div class="current-box">
      <label for="curAff" id="t_currentTitle"></label>
      <input type="number" id="curAff" min="0" oninput="setCurrent(this.value)">
      <label class="switch-line"><input type="checkbox" id="showEarlier" onchange="showEarlier=this.checked"> <span id="t_showEarlier"></span></label>
      <div class="hint" id="t_currentHint"></div>
    </div>
    <div id="presetList" class="preset-list"></div>
    <div class="targets-list" id="targetChips"></div>
    <div class="add-target-row">
      <input type="number" id="newTarget">
      <button class="btn-light" id="t_addBtn" onclick="addTarget()"></button>
    </div>
    <div class="corner-note" id="t_targetsNote"></div>
  </div>

  <div class="panel">
    <h2><span id="t_combosTitle"></span> <button class="btn-light" id="t_addComboBtn" onclick="addCombo()"></button></h2>
    <div id="comboList"></div>
    <div class="corner-note" id="t_combosNote"></div>
  </div>

  <button class="btn-primary" id="t_calcBtn" onclick="calculateAll()" style="width:100%;padding:12px;font-size:14px"></button>

  <div id="results"></div>

  <p class="footer-note" id="t_legend"></p>
</div>

let itemState = {};
TIER_ITEMS.forEach(list=>list.forEach(k=>{ itemState[k] = {cap:0, favorite:false}; }));
function setFavorite(key, tierIdx, on){
  if(on){ TIER_ITEMS[tierIdx].forEach(k=>itemState[k].favorite=false); itemState[key].favorite=true; }
  else { itemState[key].favorite=false; }
  renderVars();
}
function tierFavKey(i){ return TIER_ITEMS[i].find(k=>itemState[k].favorite) || null; }
function tierFavCap(i){ const k=tierFavKey(i); return k? itemState[k].cap : 0; }
function nfItemsOf(i,c){ return TIER_ITEMS[i].filter(k=>!itemState[k].favorite && !(c && c.nfMode==='specific' && c.nfItems && c.nfItems[k]===false)); }
function tierNonFavCap(i,c){
  const base = nfItemsOf(i,c).reduce((s,k)=>s+itemState[k].cap,0);
  if(c && c.nfMode==='limit' && c.nfLimit && c.nfLimit[i]!=='' && c.nfLimit[i]!=null) return Math.min(base, Math.max(0,+c.nfLimit[i]||0));
  return base;
}
function allocNonFav(i,n,c){
  const items = nfItemsOf(i,c).map(k=>({key:k,cap:itemState[k].cap,n:0})).filter(o=>o.cap>0);
  let left=n;
  if(c.nfMode==='even'){
    while(left>0){
      const open=items.filter(o=>o.n<o.cap); if(!open.length) break;
      const minN=Math.min(...open.map(o=>o.n));
      const lows=open.filter(o=>o.n===minN);
      for(const o of lows){ if(left<=0) break; o.n++; left--; }
    }
  } else {
    for(const o of items){ const u=Math.min(o.cap,left); o.n=u; left-=u; }
  }
  return items.filter(o=>o.n>0);
}
function tierCap(i,c){ return c.useNonFavorite ? tierFavCap(i)+tierNonFavCap(i,c) : tierFavCap(i); }
function tierPoints(i,n,c){
  if(!c.useNonFavorite) return n*FAVORITE_VALUES[i];
  const favCap = tierFavCap(i);
  const used = Math.min(n, favCap);
  return used*FAVORITE_VALUES[i] + (n-used)*NORMAL_VALUES[i];
}
function minCountForPoints(i, n0, pointsNeeded, c){
  const cap = tierCap(i,c);
  if(pointsNeeded<=0) return n0;
  if(!c.useNonFavorite){
    return Math.min(cap, Math.max(n0, Math.ceil(pointsNeeded/FAVORITE_VALUES[i])));
  }
  const favCap = tierFavCap(i);
  if(n0 < favCap){
    const fullFavPoints = favCap*FAVORITE_VALUES[i];
    if(pointsNeeded <= fullFavPoints){
      return Math.min(cap, Math.max(n0, Math.ceil(pointsNeeded/FAVORITE_VALUES[i])));
    }
    const remain = pointsNeeded - fullFavPoints;
    return Math.min(cap, favCap + Math.ceil(remain/NORMAL_VALUES[i]));
  }
  const basePoints = favCap*FAVORITE_VALUES[i] + (n0-favCap)*NORMAL_VALUES[i];
  const remain = pointsNeeded - basePoints;
  return Math.min(cap, n0 + Math.ceil(Math.max(0,remain)/NORMAL_VALUES[i]));
}

/* ===== screenshot recognizer ===== */
/* Affinity screenshot recognizer — pure browser JS, no dependencies. */
const AOCR = (function(){
const ORDER=['lollipop','cake','perfume','box','ring','crown','bear','bouquet','mirror','juice','shoe','musicbox'];
const TIER_OF=[0,0,1,1,2,2,1,1,1,2,2,2];
let TEMPLATES=[];      // [{label, f:Float32Array(256)}]
let THUMBS=null;       // {key: Float32Array}
function setTemplates(t){ TEMPLATES=t; }
function setThumbs(t){ THUMBS=t; }

function loadPixels(src,maxW){
  const sw=src.naturalWidth||src.width, sh=src.naturalHeight||src.height;
  const s=sw>maxW?maxW/sw:1, w=Math.round(sw*s), h=Math.round(sh*s);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true}); g.imageSmoothingQuality='high'; g.drawImage(src,0,0,w,h);
  return {w,h,d:g.getImageData(0,0,w,h).data};
}
function px(P,x,y){ const i=(y*P.w+x)*4; return [P.d[i],P.d[i+1],P.d[i+2]]; }

/* ---- morphology on a Uint8Array mask of size w*h ---- */
function morph(m,w,h,r,max){
  const t=new Uint8Array(w*h), o=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=max?0:1;
    for(let k=-r;k<=r;k++){ const xx=x+k; const a=(xx<0||xx>=w)?(max?0:1):m[y*w+xx]; if(max){ if(a){v=1;break;} } else { if(!a){v=0;break;} } }
    t[y*w+x]=v;
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=max?0:1;
    for(let k=-r;k<=r;k++){ const yy=y+k; const a=(yy<0||yy>=h)?(max?0:1):t[yy*w+x]; if(max){ if(a){v=1;break;} } else { if(!a){v=0;break;} } }
    o[y*w+x]=v;
  }
  return o;
}
function components(m,w,h,eight){
  const seen=new Uint8Array(w*h), out=[], st=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x; if(!m[i]||seen[i]) continue;
    let minx=x,maxx=x,miny=y,maxy=y,area=0; st.length=0; st.push(i); seen[i]=1;
    while(st.length){
      const j=st.pop(), jx=j%w, jy=(j/w)|0; area++;
      if(jx<minx)minx=jx; if(jx>maxx)maxx=jx; if(jy<miny)miny=jy; if(jy>maxy)maxy=jy;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy) continue; if(!eight&&dx&&dy) continue;
        const nx=jx+dx, ny=jy+dy; if(nx<0||ny<0||nx>=w||ny>=h) continue;
        const n=ny*w+nx; if(m[n]&&!seen[n]){ seen[n]=1; st.push(n); }
      }
    }
    out.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,area});
  }
  return out;
}

/* ---- grid detection ---- */
function findGrid(P){
  const y0=Math.floor(P.h*0.55), y1=Math.floor(P.h*0.93), H=y1-y0, W=P.w;
  const m=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=((y+y0)*W+x)*4, r=P.d[i],g=P.d[i+1],b=P.d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx>70 && (mx-mn)>0.35*mx) m[y*W+x]=1;
  }
  const c=morph(morph(m,W,H,2,true),W,H,2,false);
  let comps=components(c,W,H,false).filter(k=>k.area>0.008*W*W && k.w>0.10*W && k.w<0.20*W && k.h>=0.85*k.w && k.h<=1.5*k.w);
  comps.forEach(k=>k.y+=y0);
  if(comps.length<12) return {ok:false,reason:'cells',found:comps.length};
  comps.sort((a,b)=>a.y-b.y);
  // two rows
  const rows=[[comps[0]]];
  for(let i=1;i<comps.length;i++){ const last=rows[rows.length-1]; if(comps[i].y-last[0].y>0.5*last[0].w) rows.push([comps[i]]); else last.push(comps[i]); }

/* ---- glyph features ---- */
function glyphFeature(mask,mw,mh,box){

    const sx0=box.x+tx*gw/tw, sx1=box.x+(tx+1)*gw/tw, sy0=box.y+ty*gh/th, sy1=box.y+(ty+1)*gh/th;
    let sum=0,n=0;
    for(let yy=Math.floor(sy0);yy<Math.max(Math.floor(sy0)+1,Math.ceil(sy1));yy++)for(let xx=Math.floor(sx0);xx<Math.max(Math.floor(sx0)+1,Math.ceil(sx1));xx++){
      if(xx<0||yy<0||xx>=mw||yy>=mh) continue; sum+=mask[yy*mw+xx]; n++;

  const o=new Float32Array(S*S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){ let s=0,n=0; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const xx=x+dx,yy=y+dy; if(xx<0||yy<0||xx>=S||yy>=S) continue; s+=f[yy*S+xx]; n++; } o[y*S+x]=s/n; }

}
function classify(f){
  let best=null,bd=1e9,second=1e9,secondLabel=null;

  for(const t of TEMPLATES){ let d=0; for(let i=0;i<256;i++){ const e=f[i]-t.f[i]; d+=e*e; } if(bestBy[t.label]===undefined||d<bestBy[t.label]) bestBy[t.label]=d; }
  const arr=Object.entries(bestBy).sort((a,b)=>a[1]-b[1]);
  return {label:arr[0][0],dist:arr[0][1],ratio:arr.length>1?arr[1][1]/Math.max(arr[0][1],1e-6):99,margin:arr.length>1?arr[1][1]-arr[0][1]:99};
}

/* read a run of digits from a binary mask region; returns glyph boxes sorted by x */
function digitBoxes(mask,w,h,minH,maxH,maxW,topmost){
  let raw=components(mask,w,h,true).filter(k=>k.h>=minH&&k.h<=maxH&&k.w>=2&&k.area>=4);
  let comps=[];
  raw.forEach(k=>{
    const n=Math.round(k.w/(0.72*k.h));
    if(k.w>1.1*k.h && k.w<=2.9*k.h && n>=2 && n<=4){
      const col=[]; for(let x=0;x<k.w;x++){ let s=0; for(let y=k.y;y<k.y+k.h;y++) s+=mask[y*w+k.x+x]; col.push(s); }
      const cuts=[0];
      for(let j=1;j<n;j++){ const ex=j*k.w/n, lo=Math.max(cuts[cuts.length-1]+2,Math.floor(ex-0.2*k.w/n*n/2)), hi=Math.min(k.w-2,Math.ceil(ex+0.2*k.w/n*n/2)); let bx=Math.round(ex),bv=1e9; for(let x=lo;x<=hi;x++){ if(col[x]<bv){bv=col[x];bx=x;} } cuts.push(bx); }
      cuts.push(k.w);
      for(let j=0;j<n;j++){ const x0=k.x+cuts[j], x1=k.x+cuts[j+1]; let miny=1e9,maxy=-1,area=0,minx=1e9,maxx=-1;
        for(let y=k.y;y<k.y+k.h;y++)for(let x=x0;x<x1;x++) if(mask[y*w+x]){ area++; if(y<miny)miny=y; if(y>maxy)maxy=y; if(x<minx)minx=x; if(x>maxx)maxx=x; }
        if(area>=4) comps.push({x:minx,y:miny,w:maxx-minx+1,h:maxy-miny+1,area}); }
    } else comps.push(k);
  });
  comps=comps.filter(k=>k.w<=maxW&&k.w>=2);

  const cys=comps.map(k=>k.y+k.h/2).sort((a,b)=>a-b), med=topmost?cys[0]:cys[(cys.length/2)|0];
  comps=comps.filter(k=>Math.abs(k.y+k.h/2-med)<=maxH*0.35);
  comps.sort((a,b)=>a.x-b.x);
  return comps;
}

function maskRegion(P,x0,y0,x1,y1,pred){
  x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));x1=Math.min(P.w,Math.ceil(x1));y1=Math.min(P.h,Math.ceil(y1));

const isWhite=(r,g,b)=>Math.min(r,g,b)>=185 && (Math.max(r,g,b)-Math.min(r,g,b))<70;
const isDark=(r,g,b)=>Math.max(r,g,b)<140 && b>=g+12 && b>=r+25;

function maskRegionAdaptive(P,x0,y0,x1,y1,mode){
  x0=Math.max(0,Math.floor(x0));y0=Math.max(0,Math.floor(y0));x1=Math.min(P.w,Math.ceil(x1));y1=Math.min(P.h,Math.ceil(y1));
  const w=x1-x0,h=y1-y0,m=new Uint8Array(w*h), vals=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const i=((y+y0)*P.w+x+x0)*4, r=P.d[i],g=P.d[i+1],b=P.d[i+2];
    vals.push(mode==='white'?Math.min(r,g,b):(r+g+b)/3); }
  const sorted=vals.slice().sort((a,b)=>a-b), q=p=>sorted[Math.min(sorted.length-1,Math.floor(p*sorted.length))];
  let thr;
  if(mode==='white'){ thr=Math.max(120,Math.min(190,0.78*q(0.985))); }
  else { const lo=q(0.01), bg=q(0.6); thr=lo+0.5*(bg-lo); }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const i=((y+y0)*P.w+x+x0)*4, r=P.d[i],g=P.d[i+1],b=P.d[i+2], v=vals[y*w+x];
    if(mode==='white'){ if(v>=thr && (Math.max(r,g,b)-Math.min(r,g,b))<90) m[y*w+x]=1; }
    else { if(v<=thr && b>=g+6 && b>=r+15) m[y*w+x]=1; } }

function cellCountGlyphs(P,c){

function readDigits(R,boxes){

  const conf=boxes.length?Math.max(0,Math.min(1,1-(maxDist-1.0)/3))*Math.min(1,(minRatio-1)/1.0):0;

function hasHeart(P,c){
  const x0=Math.max(0,c.x-0.04*c.w), x1=c.x+0.40*c.w, y0=Math.max(0,c.y-0.14*c.w), y1=c.y+0.32*c.w;

function labelColors(P,c){

function thumb(P,c){

    for(let y=Math.floor(y0+(y1-y0)*ty/T[1]);y<y0+(y1-y0)*(ty+1)/T[1];y++)for(let x=Math.floor(x0+(x1-x0)*tx/T[0]);x<x0+(x1-x0)*(tx+1)/T[0];x++){ const p=px(P,x,y); s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];n++; }

function recognize(src){

function aocrInit(){
  AOCR.setTemplates(AOCR_T.map(t=>({label:t.l,f:Float32Array.from(Array.from(t.f),c=>(c.charCodeAt(0)-48)/60)})));
  const th={}; Object.keys(AOCR_TH).forEach(k=>{ const b=atob(AOCR_TH[k]); th[k]=Float32Array.from(Array.from(b),c=>c.charCodeAt(0)); }); AOCR.setThumbs(th);
}

let aocrReady=false;

let scanWarn = new Set();
async function handleScan(file){
  const st=document.getElementById('scanStatus');
  if(!file) return;
  st.className='scan-status'; st.textContent=t('scanBusy');
  try{
    const url=URL.createObjectURL(file); const im=new Image(); im.src=url; await im.decode();
    if(!aocrReady){ aocrInit(); aocrReady=true; }
    const r=AOCR.recognize(im); URL.revokeObjectURL(url);
    if(!r.ok){ st.className='scan-status bad'; st.textContent=t('scanFail'); return; }
    let n=0, favN=0; scanWarn=new Set();
    Object.keys(r.items).forEach(k=>{ const it=r.items[k]; if(!itemState[k]) return; if(it.count==null){ scanWarn.add(k); } else { itemState[k].cap=it.count; n++; } });
    TIER_ITEMS.forEach(list=>{ list.forEach(k=>itemState[k].favorite=false); const f=list.find(k=>r.items[k]&&r.items[k].fav); if(f){ itemState[f].favorite=true; favN++; } });
    const a=r.affinity; let affMsg;
    if(a&&a.ok&&a.text!==''){ currentAff=a.value; document.getElementById('curAff').value=currentAff; renderTargets(); affMsg=t('scanAff').replace('{v}',a.value); }
    else affMsg=t('scanNoAff');
    renderVars();
    st.className='scan-status ok';
    st.textContent=[t('scanDone').replace('{n}',n).replace('{f}',favN),affMsg,t('scanCheck')].join(' ');
  }catch(e){ st.className='scan-status bad'; st.textContent=t('scanFail'); }
}
document.addEventListener('paste',e=>{ const items=(e.clipboardData&&e.clipboardData.items)||[]; for(const it of items){ if(it.type&&it.type.startsWith('image/')){ handleScan(it.getAsFile()); e.preventDefault(); break; } } });
let selectedPresets = new Set(['ph1','ph2']);
let customTargets = [];
let targets = [];
let targetWeights = {};
function computeTargets(){
  const map = {};
  selectedPresets.forEach(key=>{
    PRESET_LISTS[key].forEach(v=>{ map[v]=(map[v]||0)+1; });
  });
  const all = new Set([...Object.keys(map).map(Number), ...customTargets]);
  targets = [...all].sort((a,b)=>a-b);
  targetWeights = {};
  targets.forEach(v=> targetWeights[v]=map[v]||0);
}
let currentAff = 0, showEarlier = false;

            <input class="inline-input item-qty" type="number" min="0" value="${st.cap}" onchange="itemState['${k}'].cap=Math.max(0,+this.value);scanWarn.delete('${k}');this.closest('.item-row').classList.remove('warn')">

        }).join('')}

}
function togglePreset(key, on){

}
function renderTargets(){
  const box = document.getElementById('targetChips');
  box.innerHTML = targets.map(tg=>{
    const w = targetWeights[tg]||0;
    const isCustom = customTargets.includes(tg);

  }).join('');
}
function addTarget(){
  const el = document.getElementById('newTarget');
  const val = +el.value;
  if(!isNaN(val) && val>0 && !customTargets.includes(val)){ customTargets.push(val); el.value=''; computeTargets(); renderTargets(); }
}
function removeTarget(v){ customTargets = customTargets.filter(x=>x!==v); computeTargets(); renderTargets(); }

function addCombo(){
  const id = comboSeq++;
  combos.push({id, name:'Combo '+(combos.length+1), a:0, b:1, dir:'A-B', lo:0, hi:25, cond:'always', condVal:0, tol:10, useNonFavorite:false, nfMode:'auto', nfLimit:['','',''], nfItems:{}});
  renderCombos();
}
function removeCombo(id){ combos = combos.filter(c=>c.id!==id); renderCombos(); }

function renderCombos(){
  const box = document.getElementById('comboList');
  const colorOpts = (sel,other)=>[0,1,2].filter(i=>i!==other).map(i=>`<option value="${i}" ${i==sel?'selected':''}>${tierLabel(i)}</option>`).join('');
  box.innerHTML = combos.map(c=>`
    <div class="combo-card">
      <div class="combo-head">
        <input class="inline-input combo-name" value="${c.name}" onchange="updCombo(${c.id},'name',this.value)">
        <button class="btn-danger" onclick="removeCombo(${c.id})">${t('remove')}</button>
      </div>
      <div class="combo-block">
        <div class="block-title">\u2696\uFE0F ${t('ruleTitle')}</div>
        <div class="block-hint">${t('ruleHint')}</div>
        <div class="row">
          <div class="field"><label>${t('moreColor')}</label><select onchange="setTier(${c.id},'a',+this.value)">${colorOpts(c.a,c.b)}</select></div>
          <div class="field"><label>${t('lessColor')}</label><select onchange="setTier(${c.id},'b',+this.value)">${colorOpts(c.b,c.a)}</select></div>
        </div>
        <div class="row">
          <div class="field"><label>${t('diffFrom')}</label><input class="inline-input" type="number" value="${c.lo}" onchange="updCombo(${c.id},'lo',+this.value)"></div>
          <div class="field"><label>${t('diffTo')}</label><input class="inline-input" type="number" value="${c.hi}" onchange="updCombo(${c.id},'hi',+this.value)"></div>
        </div>
      </div>
      <div class="combo-block">
        <div class="block-title">\uD83C\uDFAF ${t('applyTitle')}</div>
        <div class="seg">
          ${[['always','every'],['final','finalOnly'],['fromValue','fromValue']].map(([v,k])=>`<button class="${c.cond==v?'on':''}" onclick="setCond(${c.id},'${v}')">${t(k)}</button>`).join('')}
        </div>
        ${c.cond==='fromValue'?`<div class="row" style="margin-top:8px"><div class="field"><label>${t('fromValueLabel')}</label><input class="inline-input" type="number" value="${c.condVal}" onchange="updCombo(${c.id},'condVal',+this.value)"></div></div>`:''}
      </div>
      <label class="switch-line combo-nonfav"><input type="checkbox" ${c.useNonFavorite?'checked':''} onchange="setNf(${c.id},'useNonFavorite',this.checked)"> <span>${t('useNonFav')}</span></label>
      ${c.useNonFavorite?`<div class="combo-block">
        <div class="block-title">\uD83C\uDF81 ${t('nfTitle')}</div>
        <div class="seg">
          ${[['auto','nfAuto'],['limit','nfLimit'],['even','nfEven'],['specific','nfSpecific']].map(([v,k])=>`<button class="${c.nfMode==v?'on':''}" onclick="setNf(${c.id},'nfMode','${v}')">${t(k)}</button>`).join('')}
        </div>
        ${c.nfMode==='limit'?`<div class="block-hint" style="margin-top:8px">${t('nfLimitLabel')}</div><div class="row">${[0,1,2].map(i=>`<div class="field"><label>${tierLabel(i)}</label><input class="inline-input" type="number" min="0" placeholder="\u221E" value="${c.nfLimit[i]}" onchange="setNfLimit(${c.id},${i},this.value)"></div>`).join('')}</div>`:''}
        ${c.nfMode==='specific'?`<div class="block-hint" style="margin-top:8px">${t('nfPick')}</div><div class="pick-grid">${[0,1,2].map(i=>TIER_ITEMS[i].filter(k=>!itemState[k].favorite).map(k=>`<label class="pick t${i}"><input type="checkbox" ${c.nfItems[k]===false?'':'checked'} onchange="setNfItem(${c.id},'${k}',this.checked)"> <img src="${ITEM_IMG[k]}" alt=""> ${itemName(k)}</label>`).join('')).join('')}</div>`:''}
      </div>`:''}
      <details class="adv"><summary>${t('advanced')}</summary>
        <div class="row" style="margin-top:8px"><div class="field"><label>${t('tolerance')}</label><input class="inline-input" type="number" value="${c.tol}" onchange="updCombo(${c.id},'tol',+this.value)"></div></div>
      </details>
    </div>`).join('');
}
function setTier(id,k,v){ updCombo(id,k,v); renderCombos(); }
function setNf(id,k,v){ updCombo(id,k,v); renderCombos(); }
function setNfItem(id,key,on){ const c=combos.find(c=>c.id===id); c.nfItems[key]=on; }
function setNfLimit(id,i,v){ const c=combos.find(c=>c.id===id); c.nfLimit[i]=v===''?'':Math.max(0,+v); }
function setCond(id,v){ updCombo(id,'cond',v); renderCombos(); }
function updCombo(id,key,val){ const c = combos.find(c=>c.id===id); c[key]=val; }

function ruleActive(c, idx){
  if(c.cond==='always') return true;
  if(c.cond==='final') return idx===targets.length-1;
  if(c.cond==='fromValue') return targets[idx] >= c.condVal;
  return false;
}
function total(counts,c){ return tierPoints(0,counts[0],c)+tierPoints(1,counts[1],c)+tierPoints(2,counts[2],c); }
let capLimit=null;
function caps(c){ const r=[tierCap(0,c),tierCap(1,c),tierCap(2,c)]; return capLimit? r.map((v,i)=>Math.min(v,capLimit[i])) : r; }
function better(a, b, target){
  const aOk = a>=target, bOk = b>=target;
  if(aOk !== bOk) return aOk;
  return aOk ? a<b : a>b;
}
function exactAnyGap(prev, target, c, cap){
  let bestE=null, bestCost=Infinity;
  for(let x=prev[0];x<=cap[0];x++) for(let y=prev[1];y<=cap[1];y++){
    const p=tierPoints(0,x,c)+tierPoints(1,y,c);
    if(p>target) break;
    for(let z=prev[2];z<=cap[2];z++){
      const tot=p+tierPoints(2,z,c);
      if(tot>target) break;
      if(tot===target){ const cost=(x-prev[0])+(y-prev[1])+(z-prev[2]); if(cost<bestCost){bestCost=cost;bestE={counts:[x,y,z],tot};} break; }
    }
  }
  return bestE;
}
function solveRow(prev, target, c, idx){
  const cap = caps(c);
  const thirdIdx = [0,1,2].find(i=>i!==c.a && i!==c.b);
  const active = ruleActive(c, idx);
  const base = total(prev,c);
  if(!active){
    if(base >= target) return {counts:prev.slice(), tot:base};
    let best=null;
    for(let i=0;i<3;i++){
      const others = base - tierPoints(i,prev[i],c);
      const n = minCountForPoints(i, prev[i], target-others, c);
      const cand = prev.slice(); cand[i]=Math.max(prev[i],Math.min(cap[i],n));
      const tot = total(cand,c);
      if(best===null || better(tot,best.tot,target)) best={counts:cand, tot};
    }
    return best;
  }
  let best=null, exact=null;
  const dirA = c.dir==='A-B';
  const maxDz = Math.max(0, Math.min(60, cap[thirdIdx]-prev[thirdIdx]));
  for(let d=c.lo; d<=c.hi; d++){
    for(let dz=0; dz<=maxDz; dz++){
      const z = prev[thirdIdx]+dz;
      const zp = tierPoints(thirdIdx,z,c);
      // x = count of the "base" tier, y = x + d the other
      const lowIdx = dirA ? c.b : c.a, highIdx = dirA ? c.a : c.b;
      const xMin = Math.max(prev[lowIdx], prev[highIdx]-d, 0);
      for(let x=xMin; x<=cap[lowIdx]; x++){
        const y = x+d;
        if(y>cap[highIdx]) break;
        if(y<prev[highIdx]) continue;
        const counts=[0,0,0]; counts[lowIdx]=x; counts[highIdx]=y; counts[thirdIdx]=z;
        const tot = tierPoints(lowIdx,x,c)+tierPoints(highIdx,y,c)+zp;
        if(tot===target && (exact===null || z<exact.counts[thirdIdx])) exact={counts,tot};
        if(best===null || better(tot,best.tot,target)) best={counts,tot};
        if(tot>=target) break;
      }
    }
  }
  if(!best) return {counts:prev.slice(), tot:base};
  if(idx===targets.length-1){
    if(exact) return exact;           // highest priority: hit the final target exactly
    const fx = exactAnyGap(prev, target, c, cap);
    if(fx) return fx;
  }
  return best;
}

function cellCount(i,n,c){
  const fk=tierFavKey(i);
  if(!c.useNonFavorite || !fk) return n;
  const fav=Math.min(n,tierFavCap(i));
  return n>fav ? `${n} <small>(★${fav}+${n-fav})</small>` : `${n}`;
}
function gapOf(counts,c){ return c.dir==='A-B' ? counts[c.a]-counts[c.b] : counts[c.b]-counts[c.a]; }
function runPass(c, F){
  capLimit = F;
  let prev=[0,0,0]; const rows=[];
  targets.forEach((tg,idx)=>{
    let sol;
    if(F && idx===targets.length-1) sol={counts:F.slice(), tot:total(F,c)};
    else sol=solveRow(prev,tg,c,idx);
    rows.push({target:tg, counts:sol.counts, tot:sol.tot, overage:sol.tot-tg});
    prev=sol.counts;
  });
  capLimit=null;
  return rows;
}
function scoreRows(rows,c){
  let short=0, gapBad=0, ov=0;
  rows.forEach((r,i)=>{
    if(r.overage<0) short++; else ov+=r.overage;
    if(ruleActive(c,i)){ const d=gapOf(r.counts,c); if(d<c.lo||d>c.hi) gapBad++; }
  });
  return [short,gapBad,ov];
}
function solveCombo(c){
  // Final target must hit exactly: pick final counts first, then solve earlier rows beneath them.
  const last=targets[targets.length-1];
  const cap=caps(c);
  const cands=[], candsAny=[];
  for(let x=0;x<=cap[0];x++){
    const px=tierPoints(0,x,c); if(px>last) break;
    for(let y=0;y<=cap[1];y++){
      const pxy=px+tierPoints(1,y,c); if(pxy>last) break;
      for(let z=0;z<=cap[2];z++){
        const tt=pxy+tierPoints(2,z,c); if(tt>last) break;
        if(tt===last){
          const F=[x,y,z];
          candsAny.push(F);
          if(!ruleActive(c,targets.length-1)){ cands.push(F); }
          else { const d=gapOf(F,c); if(d>=c.lo&&d<=c.hi) cands.push(F); }
          break;
        }
      }
    }
  }
  let pool = cands.length? cands : candsAny;
  if(!pool.length) return runPass(c,null);   // impossible with this inventory: shows shortfall
  pool = pool.slice().sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  if(pool.length>40){ const step=pool.length/40; pool=Array.from({length:40},(_,i)=>pool[Math.floor(i*step)]); }
  let best=null, bs=null;
  pool.forEach(F=>{
    const rows=runPass(c,F), sc=scoreRows(rows,c);
    if(!bs || sc[0]<bs[0] || (sc[0]===bs[0] && (sc[1]<bs[1] || (sc[1]===bs[1] && sc[2]<bs[2])))){ best=rows; bs=sc; }
  });
  return best;
}
function calculateAll(){
  const resBox = document.getElementById('results');
  resBox.innerHTML = '';
  combos.forEach(c=>{
    const allRows = solveCombo(c);
    const rows = showEarlier || currentAff<=0 ? allRows : allRows.filter(r=>r.target>currentAff);
    const hiddenN = allRows.length - rows.length;
    const lastRow = allRows[allRows.length-1];
    if(!rows.length){
      const p0=document.createElement('div'); p0.className='panel';
      p0.innerHTML=`<h2>${c.name}</h2><div class="summary">${t('noRows')}</div>`; resBox.appendChild(p0); return;
    }
    const effTol = r=> Math.max(1, Math.floor(c.tol / Math.max(1, targetWeights[r.target]||1)));
    const exactN = rows.filter(r=>r.overage===0).length;
    const nearN = rows.filter(r=>r.overage>=0 && r.overage<=effTol(r)).length;
    const shortN = rows.filter(r=>r.overage<0).length;
    const totOv = rows.reduce((s,r)=>s+Math.max(0,r.overage),0);
    const breakdown = [0,1,2].map(i=>{
      const n=lastRow.counts[i], fk=tierFavKey(i), parts=[];
      const fav=Math.min(n,tierFavCap(i));
      if(fk && fav>0) parts.push(`\u2605${itemName(fk)}\u00d7${fav}`);
      if(c.useNonFavorite && n>fav) allocNonFav(i,n-fav,c).forEach(o=>parts.push(`${itemName(o.key)}\u00d7${o.n}`));
      return `<div><b>${tierLabel(i)}</b>: ${parts.join(', ')||'\u2014'}</div>`;
    }).join('');
    const panel = document.createElement('div');
    panel.className='panel';
    panel.innerHTML = `<h2>${c.name}</h2>
      <table class="result-table"><tr><th>${t('targetsTitle')}</th><th>${tierLabel(0)}</th><th>${tierLabel(1)}</th><th>${tierLabel(2)}</th><th>Total</th><th>${t('totalOv')}</th><th>Gap</th></tr>
      ${rows.map((r)=>{
        const d = c.dir==='A-B' ? r.counts[c.a]-r.counts[c.b] : r.counts[c.b]-r.counts[c.a];
        const inBand = d>=c.lo && d<=c.hi;
        const w = targetWeights[r.target]||0;
        const ovClass = r.overage<0 ? 'short' : (r.overage===0?'exact':(r.overage<=effTol(r)?'near':''));
        const tgCell = w>=2 ? `${r.target}<span class="w-badge">\u00d7${w}</span>` : r.target;
        return `<tr><td>${tgCell}</td><td>${cellCount(0,r.counts[0],c)}</td><td>${cellCount(1,r.counts[1],c)}</td><td>${cellCount(2,r.counts[2],c)}</td><td>${r.tot}</td>
          <td class="${ovClass}">${r.overage}</td><td class="${inBand?'gap-inband':''}">${d}</td></tr>`;
      }).join('')}
      </table>
      ${hiddenN?`<div class="summary">${t('hiddenRows').replace('{n}',hiddenN)}</div>`:''}
      <div class="summary">${t('exact')}: <b>${exactN}/${rows.length}</b> &nbsp;|&nbsp; ${t('within')} (${t('incl')}): <b>${nearN}/${rows.length}</b> &nbsp;|&nbsp; ${t('totalOv')}: <b>${totOv}</b>${shortN?` &nbsp;|&nbsp; <span style="color:var(--danger)">${t('shortfall')}: ${shortN}</span>`:''} &nbsp;|&nbsp; ${t('finalCounts')}: ${tierLabel(0)}=${lastRow.counts[0]}, ${tierLabel(1)}=${lastRow.counts[1]}, ${tierLabel(2)}=${lastRow.counts[2]}</div>
      <div class="summary"><b>${t('nfBreakdown')}</b>${breakdown}</div>`;
    resBox.appendChild(panel);
  });
}

computeTargets();
applyStatic(); renderVars(); renderPresets(); renderTargets();
addCombo(); combos[0].name='Combo 1'; combos[0].lo=0; combos[0].hi=25;
renderCombos();
</script>
